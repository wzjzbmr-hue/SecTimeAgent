# 宿主机国产大模型代理配置（官方白名单网关 + 宿主机 Key 托管 + 多厂商自动主备切换）
# 优先级：Kimi (kimi-k3.1-pro-highspeed) -> 阿里云 TokenPlan (glm-5.3 / qwen4-max)
#       -> 阿里云 DashScope 按量保底 (glm-5.3 / qwen4-max / kimi-k3.1-pro) -> 智谱 GLM Coding Plan (11/30 恢复后备援)
#
# 现场调试时：在平台“环境配置 -> 网关配置”登记下方各官方 base_url，
# 并将平台生成的专属代理 URL 替换进 url 字段；Anthropic 协议路径严禁省略 /v1（客户端会自动拼接 /v1/messages）

routes:
  kimi:
    # 优先级 1：月之暗面 Kimi 官方 Anthropic 网关（主力旗舰高速版）
    url: https://api.moonshot.cn/anthropic
    api_key_env: KIMI_API_KEY
    auth_header: both
    model_override: kimi-k3.1-pro-highspeed
    fallbacks:
      - kimi_code
      - tp_glm
      - tp_qwen
      - ali_glm
      - ali_qwen
      - ali_kimi
      - glm_coding

  kimi_code:
    # 优先级 1b：月之暗面 Kimi 代码专项高速版
    url: https://api.moonshot.cn/anthropic
    api_key_env: KIMI_API_KEY
    auth_header: both
    model_override: kimi-k2.7-code-highspeed
    fallbacks:
      - tp_glm
      - tp_qwen
      - ali_glm

  tp_glm:
    # 优先级 2：阿里云 TokenPlan 包量套餐 -> GLM-5.3
    url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
    api_key_env: QWEN_TOKEN_PLAN_API_KEY
    auth_header: both
    model_override: glm-5.3
    fallbacks:
      - tp_qwen
      - ali_glm
      - ali_qwen
      - glm_coding

  tp_qwen:
    # 优先级 3：阿里云 TokenPlan 包量套餐 -> Qwen4-Max
    url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
    api_key_env: QWEN_TOKEN_PLAN_API_KEY
    auth_header: both
    model_override: qwen4-max
    fallbacks:
      - ali_qwen
      - ali_glm
      - ali_kimi

  ali_glm:
    # 优先级 4a：阿里云 DashScope 按量保底 -> GLM-5.3
    url: https://dashscope.aliyuncs.com/apps/anthropic
    api_key_env: ALI_DASHSCOPE_API_KEY
    auth_header: both
    model_override: glm-5.3
    fallbacks:
      - ali_qwen
      - ali_kimi

  ali_qwen:
    # 优先级 4b：阿里云 DashScope 按量保底 -> Qwen4-Max
    url: https://dashscope.aliyuncs.com/apps/anthropic
    api_key_env: ALI_DASHSCOPE_API_KEY
    auth_header: both
    model_override: qwen4-max
    fallbacks:
      - ali_kimi

  ali_kimi:
    # 优先级 4c：阿里云 DashScope 按量保底 -> Kimi-K3.1-Pro
    url: https://dashscope.aliyuncs.com/apps/anthropic
    api_key_env: ALI_DASHSCOPE_API_KEY
    auth_header: both
    model_override: kimi-k3.1-pro
    fallbacks:
      - glm_coding

  glm_coding:
    # 优先级 5（备援）：智谱官方 GLM Coding Plan
    url: https://open.bigmodel.cn/api/anthropic
    api_key_env: GLM_CODING_API_KEY
    auth_header: both
    model_override: glm-5
    fallbacks:
      - tp_glm
      - ali_glm
