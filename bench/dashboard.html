<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SecTimeAgent 人类决策驾驶舱（本地评估观测）</title>
<style>
  :root {
    --bg: #090e1c; --panel: #11182b; --panel-2: #17213a; --panel-3: #1e2a49;
    --border: #263559; --border-strong: #374d80;
    --text: #e8eefb; --muted: #8fa2c8; --dim: #64779e;
    --accent: #38bdf8; --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --purple: #a78bfa;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.45;
  }
  button, input, select { font-family: inherit; font-size: 12px; color: var(--text); }
  button {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 11px; cursor: pointer; transition: border-color .15s, background .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--panel-3); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input, select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Top Sticky Header */
  header.topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 18px; background: rgba(17, 24, 43, 0.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand-title { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); display: inline-block; flex-shrink: 0; }
  .live-dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .live-dot.err { background: var(--err); box-shadow: none; }
  .meta-chip {
    font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .meta-chip strong { color: var(--text); }
  .conn-strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .conn-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 8px;
    border-radius: 99px; background: var(--bg); border: 1px solid var(--border);
  }
  .conn-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .conn-pill.connected .dot { background: var(--ok); }
  .conn-pill.degraded .dot { background: var(--warn); }
  .conn-pill.disconnected .dot { background: var(--err); }
  .conn-pill.unconfigured .dot { background: #64748b; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn-primary { border-color: rgba(56,189,248,0.5); color: var(--accent); }
  .btn-warn { border-color: rgba(245,158,11,0.5); color: var(--warn); }
  .btn-danger { border-color: rgba(239,68,68,0.5); color: var(--err); }

  /* Toast notifications */
  #toastContainer {
    position: fixed; top: 62px; right: 18px; z-index: 50; display: grid; gap: 8px; max-width: 420px; pointer-events: none;
  }
  .toast {
    pointer-events: auto; background: var(--panel-2); border: 1px solid var(--border-strong);
    border-left: 4px solid var(--accent); border-radius: 8px; padding: 9px 12px;
    font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .toast.ok { border-left-color: var(--ok); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.err { border-left-color: var(--err); }

  /* Main Container */
  main { padding: 14px 18px 28px; max-width: 1720px; margin: 0 auto; display: grid; gap: 14px; }

  /* System Diagnosis Alert Banners */
  .diag-banners { display: grid; gap: 8px; }
  .diag-banner {
    display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 8px;
    background: rgba(245,158,11,0.09); border: 1px solid rgba(245,158,11,0.35); font-size: 12px;
  }
  .diag-banner.error { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.4); }
  .diag-banner.info { background: rgba(56,189,248,0.08); border-color: rgba(56,189,248,0.32); }
  .diag-banner b { display: block; margin-bottom: 2px; }

  /* KPI Strip */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; }
  .kpi .label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .kpi .val { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* Taxonomy Matrix */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .panel-sub { font-size: 11px; color: var(--muted); }
  .cat-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
  .cat-pill { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .cat-pill.excluded { opacity: 0.55; border-style: dashed; }
  .cat-pill .cname { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 4px; }
  .cat-pill .cmeta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; gap: 6px; }
  .progress { height: 5px; background: #162038; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width 0.35s; }
  .progress.na > div { background: #334155; }

  /* 3-Column Human Decision Cockpit */
  .cockpit-grid {
    display: grid;
    grid-template-columns: minmax(265px, 310px) minmax(420px, 1fr) minmax(290px, 340px);
    gap: 12px; align-items: start;
  }
  @media (max-width: 1120px) { .cockpit-grid { grid-template-columns: 290px 1fr; } .col-right { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; } }
  @media (max-width: 860px) { .cockpit-grid { grid-template-columns: 1fr; } }

  /* Left Queue */
  .queue-controls { display: grid; gap: 8px; margin-bottom: 10px; }
  .filter-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { padding: 3px 8px; font-size: 11px; border-radius: 99px; background: var(--bg); }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.12); }
  #qGrid { display: grid; gap: 8px; max-height: 78vh; overflow-y: auto; padding-right: 2px; }
  button.qcard {
    width: 100%; text-align: left; display: block;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px;
  }
  button.qcard:hover { border-color: var(--accent); background: #0f172b; color: var(--text); }
  button.qcard.selected { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: #101b33; }
  button.qcard.solved { border-color: rgba(34,197,94,0.45); }
  .qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .qtitle { font-size: 13px; font-weight: 700; color: var(--text); }
  .qsub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .state-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .b-ok { background: rgba(34,197,94,0.16); color: var(--ok); }
  .b-run { background: rgba(56,189,248,0.16); color: var(--accent); }
  .b-warn { background: rgba(245,158,11,0.18); color: var(--warn); }
  .b-err { background: rgba(239,68,68,0.2); color: var(--err); }
  .b-muted { background: rgba(143,162,200,0.14); color: var(--muted); }
  .b-purple { background: rgba(167,139,250,0.18); color: var(--purple); }
  .qfooter { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 6px; gap: 6px; flex-wrap: wrap; }

  /* Center Workspace */
  .col-center { display: grid; gap: 14px; }
  .focus-panel { border-color: rgba(56,189,248,0.45); background: linear-gradient(180deg, #131e38 0%, #11182b 100%); }
  .focus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 8px; margin-top: 8px; }
  .fcell { background: rgba(9,14,28,0.72); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; }
  .fcell .flabel { font-size: 10px; color: var(--muted); }
  .fcell .fval { font-size: 12px; font-weight: 600; margin-top: 3px; word-break: break-word; }
  .idle-box { background: rgba(9,14,28,0.65); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 11px 13px; display: grid; gap: 5px; }

  /* Tabs inside Detail Workspace */
  .tablist { display: flex; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab-btn { background: transparent; border-color: transparent; color: var(--muted); padding: 5px 10px; }
  .tab-btn[aria-selected="true"] { background: rgba(56,189,248,0.14); border-color: rgba(56,189,248,0.45); color: var(--accent); font-weight: 600; }

  .kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .kv-card { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; }
  .kv-card .k { font-size: 10px; color: var(--muted); }
  .kv-card .v { font-size: 12px; font-weight: 600; margin-top: 2px; word-break: break-word; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th, table.tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(38,53,89,0.65); vertical-align: top; }
  table.tbl th { font-size: 11px; color: var(--muted); font-weight: 600; background: rgba(9,14,28,0.6); }
  table.tbl tr:hover td { background: rgba(56,189,248,0.05); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }

  .milestone-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .ms-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .ms-card.done { border-color: rgba(34,197,94,0.5); }
  .ms-card.failed { border-color: rgba(239,68,68,0.5); }

  pre.codebox {
    background: var(--bg); border: 1px solid var(--border); padding: 8px 10px; border-radius: 7px;
    font-size: 11px; margin: 5px 0 0; white-space: pre-wrap; word-break: break-word; color: #cbd5e1;
    max-height: 220px; overflow-y: auto;
  }

  /* Right Column */
  .col-right { display: grid; gap: 12px; }
  .kv-list { display: grid; gap: 6px; font-size: 12px; }
  .kv-line { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed rgba(38,53,89,0.65); padding-bottom: 5px; }
  .kv-line:last-child { border-bottom: none; padding-bottom: 0; }
  .conn-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: grid; gap: 3px; }
  .conn-card .chead { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 12px; }
  .conn-card .cdetail { font-size: 11px; color: var(--muted); }

  .feed-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .feed { max-height: 310px; overflow-y: auto; display: grid; gap: 6px; font-size: 11px; }
  .feed-item { background: var(--bg); border: 1px solid rgba(38,53,89,0.6); border-left: 3px solid var(--border); padding: 6px 8px; border-radius: 5px; }
  .feed-item.ok { border-left-color: var(--ok); }
  .feed-item.error { border-left-color: var(--err); }
  .feed-item.warn { border-left-color: var(--warn); }
  .feed-item.info { border-left-color: var(--accent); }
  .feed-item.highlight { box-shadow: 0 0 0 1px var(--accent); background: rgba(56,189,248,0.1); }
  .feed-meta { color: var(--dim); font-size: 10px; display: flex; justify-content: space-between; gap: 6px; margin-bottom: 2px; }

  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); } .accent { color: var(--accent); } .muted { color: var(--muted); }

  /* Accessible Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(3,6,14,0.72);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px;
    max-width: 480px; width: 100%; padding: 18px; display: grid; gap: 12px;
    box-shadow: 0 18px 48px rgba(0,0,0,0.6);
  }
  .modal h3 { margin: 0; font-size: 15px; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* Lightweight Native SVG DAG Viewer */
  .dag-toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .dag-tools-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .dag-viewport {
    position: relative; width: 100%; height: 470px; overflow: hidden;
    background-color: #070c18;
    background-image:
      linear-gradient(rgba(56,189,248,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    border: 1px solid var(--border); border-radius: 9px;
    cursor: grab; user-select: none; touch-action: none;
  }
  .dag-viewport.expanded {
    position: fixed; inset: 56px 24px 24px 24px; width: auto; height: auto; z-index: 55;
    box-shadow: 0 20px 64px rgba(0,0,0,0.75); border-color: var(--accent);
  }
  .dag-expand-close {
    position: absolute; top: 10px; right: 12px; z-index: 6;
    background: rgba(17,24,43,0.92); border-color: var(--accent); color: var(--accent);
  }
  .dag-viewport.dragging { cursor: grabbing; }
  .dag-viewport svg { width: 100%; height: 100%; display: block; }
  .dag-node { cursor: pointer; }
  .dag-node:hover rect.node-box { stroke-width: 2.2; }
  .dag-node.selected rect.node-box { stroke: #f8fafc !important; stroke-width: 2.6; filter: drop-shadow(0 0 8px rgba(56,189,248,0.55)); }
  @keyframes dagWorkPulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.45; }
  }
  .dag-node.working rect.node-box { animation: dagWorkPulse 1.8s ease-in-out infinite; }
  .dag-legend-bar {
    margin-top: 6px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    background: rgba(9, 14, 28, 0.72); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px; font-size: 11px; color: var(--muted);
  }
  .dag-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .dag-inspector {
    margin-top: 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; display: grid; gap: 7px;
  }
  .dag-jump-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; }
  .dag-jump-chip { padding: 2px 7px; font-size: 11px; border-radius: 99px; }

  /* Per-Question Budget Progress Panel */
  .budget-strip {
    margin-bottom: 12px; background: rgba(9, 14, 28, 0.72);
    border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
  }
  .budget-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .budget-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .budget-table th, .budget-table td { padding: 5px 7px; border-bottom: 1px solid rgba(38,53,89,0.5); text-align: left; }
  .budget-table th { font-size: 10.5px; color: var(--muted); font-weight: 600; }
  .budget-table tr:last-child td { border-bottom: none; }
  .bbar { height: 7px; background: #162038; border-radius: 99px; overflow: hidden; min-width: 96px; }
  .bbar > div { height: 100%; border-radius: 99px; transition: width 0.3s; }
  .bbar.ok > div { background: linear-gradient(90deg, var(--accent), var(--ok)); }
  .bbar.warn > div { background: var(--warn); }
  .bbar.critical > div { background: var(--err); }
  .bbar.na { border: 1px dashed #334155; background: transparent; }
  .bbar.na > div { width: 0% !important; }

  /* Per-Question LLM Q&A Timeline */
  .llm-timeline { display: grid; gap: 10px; position: relative; padding-left: 16px; }
  .llm-timeline::before {
    content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(180deg, rgba(56,189,248,0.6), rgba(34,197,94,0.35));
  }
  .llm-turn {
    position: relative; background: var(--bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 12px; display: grid; gap: 7px;
  }
  .llm-turn::before {
    content: ""; position: absolute; left: -15px; top: 14px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--panel);
  }
  .llm-turn.err::before { background: var(--err); }
  .llm-turn.fo::before { background: var(--warn); }
  .llm-turn-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .llm-qa-preview { display: grid; gap: 4px; font-size: 12px; }
  .llm-qa-line { display: flex; gap: 6px; align-items: baseline; }
  .llm-tag {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
  }
  .llm-tag-q { background: rgba(56,189,248,0.18); color: var(--accent); }
  .llm-tag-a { background: rgba(34,197,94,0.18); color: var(--ok); }
  .llm-tag-t { background: rgba(167,139,250,0.2); color: var(--purple); }
  .llm-detail-box { display: grid; gap: 8px; padding-top: 6px; border-top: 1px dashed rgba(38,53,89,0.75); }

  /* Obtained Flags Display (Only Already-Solved Flags) */
  .obtained-flags-box {
    margin-bottom: 10px; background: rgba(13, 40, 31, 0.42);
    border: 1px solid rgba(34, 197, 94, 0.38); border-radius: 8px;
    padding: 8px 11px; display: grid; gap: 6px;
  }
  .obtained-flags-list { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .flag-pill {
    display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: rgba(7, 12, 24, 0.85); border: 1px solid rgba(34, 197, 94, 0.45);
    border-radius: 7px; padding: 4px 8px; font-size: 11.5px;
  }
  .flag-code {
    color: #86efac; font-weight: 600; word-break: break-all; user-select: all;
  }
  .btn-copy-mini {
    padding: 1px 6px; font-size: 10px; border-radius: 4px; line-height: 1.4;
  }
  .qflag-preview {
    font-family: var(--mono); font-size: 10.5px; color: #86efac;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<header class="topbar">
  <div class="brand-group">
    <span id="connDot" class="live-dot" title="实时数据流连接状态"></span>
    <span class="brand-title">SecTimeAgent 人类决策驾驶舱</span>
    <span id="clockBadge" class="meta-chip" title="比赛总计时，不代表当前单题执行耗时">比赛总计时 <strong>00:00:00 / 04:00:00</strong></span>
    <span id="freshnessBadge" class="meta-chip">数据同步: <strong>初始化中...</strong></span>
  </div>

  <div class="conn-strip" id="headerConnStrip" aria-label="组件连接状态"></div>

  <div class="header-actions">
    <button id="btnRelease" type="button" class="btn-primary" onclick="handleReleaseNextWave()">提前释放下一波题目</button>
    <button id="btnExport" type="button" onclick="handleExportReport()">导出报告</button>
    <button id="btnRefresh" type="button" onclick="handleManualRefresh()">立即刷新</button>
    <button id="btnReset" type="button" class="btn-warn" onclick="openResetModal()">重置仿真赛</button>
  </div>
</header>

<main>

<script>
// === Client State (preserved across SSE refreshes) ===
let latestSnap = null;
let selectedQid = null;
let selectedFocusQid = null;
let selectedAttemptByQid = {};
let activeDetailTab = 'exec';
let qFilter = 'all';
let showAllCanonical8 = false;
let connExpanded = false;
let budgetExpanded = true;
let pauseGlobalScroll = false;
let highlightedEventId = null;

// Event deduplication & sequence gap tracking (Section 6.1)
let currentRunId = null;
let eventMap = new Map();
let orderedEvents = [];
let maxSeenSeq = 0;
let gapRecoverCount = 0;

// Human-only reference credentials kept strictly in volatile JS memory (never persisted)
let humanRefToken = '';
let humanOperatorName = 'local-operator';
let humanRefCache = {};

// Lazy on-demand Fact-Intent DAG & Tool-Call Summary state (fetched ONLY when tab is open & counts change)
let dagCacheByQid = {};
let dagSigByQid = {};
let dagSelectedNodeByQid = {};
let dagInflightQid = null;
let dagLayoutDir = 'TB';
let dagExpanded = false;
let dagZoom = 1.0;
let dagPan = { x: 18, y: 18 };
let dagLastCanvasSize = { w: 720, h: 360 };
let toolsCacheByQid = {};
let toolsSigByQid = {};
let toolsInflightQid = null;
let toolsFilterMode = 'all';
let toolsSearchTerm = '';
let toolsExpandedIds = new Set();
let llmCacheByQid = {};
let llmSigByQid = {};
let llmInflightQid = null;
let llmFilterMode = 'all';
let llmSearchTerm = '';
let llmOrderAsc = true;
let llmExpandedSeqs = new Set();

// === Strict Value Formatters (Fixes D01: ZERO undefined / NaN / fake 00:00:00) ===
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isNum(v) {
  return typeof v === 'number' && Number.isFinite(v);
}
function fmtDuration(sec, fallback = '未上报') {
  if (!isNum(sec) || sec < 0) return fallback;
  const s = Math.floor(sec);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const r = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${r}`;
}
function fmtNum(v, fallback = '未知') {
  return isNum(v) ? v.toLocaleString('en-US') : fallback;
}
function fmtClockTime(val) {
  if (val === null || val === undefined || val === '') return '未上报';
  let d = null;
  if (typeof val === 'number' && Number.isFinite(val)) {
    d = new Date(val > 1e12 ? val : val * 1000);
  } else {
    const parsed = new Date(String(val));
    if (!Number.isNaN(parsed.getTime())) d = parsed;
  }
  if (d && !Number.isNaN(d.getTime())) {
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    return `${hh}:${mm}:${ss}`;
  }
  const m = String(val).match(/T(\d{2}:\d{2}:\d{2})/);
  return m ? m[1] : String(val);
}
function toast(msg, kind = 'info') {
  const box = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.remove(); }, 4500);
}
async function copyFromAttr(btn) {
  const text = btn && btn.dataset ? (btn.dataset.copy || '') : '';
  const label = btn && btn.dataset ? (btn.dataset.label || 'Flag') : 'Flag';
  if (!text) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(`已复制 ${label}`, 'ok');
  } catch (e) {
    toast('复制失败，请手动选中文本复制', 'warn');
  }
}
function renderObtainedFlagsBox(q, titlePrefix = '') {
  const flags = (q && q.obtained_flags) || [];
  if (!flags.length) return '';
  const v = (q && q.states && q.states.verdict) || {};
  const denom = (v.type === 'flag' && isNum(v.total) && v.total > 0) ? `/${v.total}` : '';
  const pills = flags.map(f => {
    const meta = [
      f.obtained_at_iso ? fmtClockTime(f.obtained_at_iso) : null,
      isNum(f.score) ? `+${f.score}` : null,
    ].filter(Boolean).join(' · ');
    return `<div class="flag-pill">
      <span class="badge b-ok">${esc(f.flag_label || 'Flag')}</span>
      <code class="flag-code">${esc(f.flag)}</code>
      ${meta ? `<span class="muted" style="font-size:10.5px;">${esc(meta)}</span>` : ''}
      <button type="button" class="btn-copy-mini" data-copy="${esc(f.flag)}" data-label="${esc(`${q.id} ${f.flag_label || 'Flag'}`)}" onclick="copyFromAttr(this)">复制</button>
    </div>`;
  }).join('');
  return `<div class="obtained-flags-box" id="obtainedFlagsBox-${esc(q.id)}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <b style="font-size:12px;color:#86efac;">✓ ${esc(titlePrefix)}已获得 Flag 明细（${flags.length}${denom}）</b>
      <span class="muted" style="font-size:10.5px;">仅展示已验收获得的 Flag · 点击可一键复制</span>
    </div>
    <div class="obtained-flags-list">${pills}</div>
  </div>`;
}

// === Event Ingestion with Dedup + Gap Backfill ===
async function ingestEvents(runId, events, serverLastSeq) {
  if (runId && currentRunId && runId !== currentRunId) {
    eventMap.clear();
    orderedEvents = [];
    maxSeenSeq = 0;
    humanRefCache = {};
    dagCacheByQid = {};
    dagSigByQid = {};
    dagSelectedNodeByQid = {};
    toolsCacheByQid = {};
    toolsSigByQid = {};
    toolsExpandedIds.clear();
    llmCacheByQid = {};
    llmSigByQid = {};
    llmExpandedSeqs.clear();
  }
  if (runId) currentRunId = runId;

  const incoming = Array.isArray(events) ? events : [];
  let minIncomingSeq = Infinity;
  for (const ev of incoming) {
    if (!ev || !ev.event_id) continue;
    if (isNum(ev.seq)) minIncomingSeq = Math.min(minIncomingSeq, ev.seq);
    eventMap.set(ev.event_id, ev);
  }
  // Detect sequence gap & backfill missing events automatically
  if (maxSeenSeq > 0 && isNum(minIncomingSeq) && minIncomingSeq > maxSeenSeq + 1) {
    try {
      const r = await fetch(`/api/dashboard/events?since_seq=${maxSeenSeq}&limit=300`);
      if (r.ok) {
        const d = await r.json();
        for (const ev of (d.events || [])) {
          if (ev && ev.event_id) eventMap.set(ev.event_id, ev);
        }
        gapRecoverCount += 1;
      }
    } catch (_) {}
  }
  orderedEvents = Array.from(eventMap.values()).sort((a, b) => (a.seq || 0) - (b.seq || 0));
  if (orderedEvents.length) {
    maxSeenSeq = Math.max(maxSeenSeq, orderedEvents[orderedEvents.length - 1].seq || 0);
  }
  if (isNum(serverLastSeq) && serverLastSeq > maxSeenSeq && orderedEvents.length === 0) {
    maxSeenSeq = serverLastSeq;
  }
}

// === Badge Helpers for 4 Separated States ===
function envBadge(env) {
  const map = {
    running: ['b-run', env.label],
    starting: ['b-warn', env.label],
    stopping: ['b-warn', env.label],
    stopped: ['b-muted', env.label],
    never_started: ['b-muted', env.label],
    failed: ['b-err', env.label],
    not_applicable: ['b-purple', '纯附件'],
  };
  return map[env.code] || ['b-muted', env.label || '未知'];
}
function schedBadge(sch) {
  const map = {
    completed: ['b-ok', sch.label],
    running: ['b-run', sch.label],
    external_active: ['b-warn', sch.label],
    revisit: ['b-warn', sch.label],
    exhausted: ['b-err', sch.label],
    locked: ['b-muted', sch.label],
    queued: ['b-muted', sch.label],
  };
  return map[sch.code] || ['b-muted', sch.label || '未知'];
}
function workerBadge(w) {
  const map = {
    running: ['b-run', w.worker_id ? `Worker:${w.worker_id}` : w.label],
    waiting_llm: ['b-purple', w.worker_id ? `推理:${w.worker_id}` : w.label],
    waiting_tool: ['b-run', w.label],
    offline: ['b-err', w.label],
    unassigned: ['b-warn', w.label],
    idle: ['b-muted', w.label],
  };
  return map[w.code] || ['b-muted', w.label || '未知'];
}
function verdictBadge(v) {
  if (v.status === 'passed') return ['b-ok', v.short_label];
  if (v.status === 'partial' || v.status === 'in_progress') return ['b-run', v.short_label];
  if (v.status === 'failed') return ['b-err', v.short_label];
  if (v.status === 'unconfigured') return ['b-warn', '判定未配置'];
  return ['b-muted', v.short_label];
}

// === Main Render ===
async function render(snap) {
  latestSnap = snap;
  await ingestEvents(snap.run_id, snap.events, snap.last_seq);

  const sum = snap.summary || {};
  const clk = snap.clock || {};

  // Header clock & freshness
  document.getElementById('clockBadge').innerHTML =
    `比赛总计时 <strong>${fmtDuration(clk.elapsed_sec)} / ${fmtDuration(clk.duration_sec)}</strong>`;
  document.getElementById('freshnessBadge').innerHTML =
    `数据同步 <strong>${esc(fmtClockTime(snap.observed_at))}</strong>` +
    (gapRecoverCount ? ` · 补拉 ${gapRecoverCount}` : '');

  // Header connection pills
  const connLabels = { platform: '平台', docker: 'Docker', orchestrator: '总控', cairn: 'Cairn', proxy: '代理' };
  const conns = snap.connections || {};
  document.getElementById('headerConnStrip').innerHTML = Object.entries(connLabels).map(([k, lbl]) => {
    const c = conns[k] || { status: 'unknown' };
    return `<a href="#connPanel" class="conn-pill ${esc(c.status)}" title="${esc(c.error_reason || '连接正常')}">
      <span class="dot"></span><span>${lbl}</span>
    </a>`;
  }).join('');

  // D09: State-aware Release Next Wave button
  const btnRel = document.getElementById('btnRelease');
  if (!btnRel.dataset.loading) {
    if ((sum.unreleased_questions || 0) <= 0) {
      btnRel.disabled = true;
      btnRel.textContent = `全部题目已放出 (${sum.visible_questions || 0}/${sum.total_questions || 0})`;
      btnRel.title = '当前所有波次题目均已放出，无剩余待释放题目';
    } else {
      btnRel.disabled = false;
      btnRel.textContent = `提前释放下一波题目 (余 ${sum.unreleased_questions} 题)`;
      btnRel.title = '立即解锁下一波定时放出的题目';
    }
  }

  // System Diagnosis Banners (D08, D12)
  const diags = snap.system_diagnosis || [];
  document.getElementById('diagBanners').innerHTML = diags.map(d =>
    `<div class="diag-banner ${esc(d.level)}"><div><b>${esc(d.title)}</b><span>${esc(d.detail)}</span></div></div>`
  ).join('');

  // Auto-select first question BEFORE rendering KPI so KPI Card 2 immediately reflects selected question's Flag ratio!
  if (!selectedQid && snap.questions && snap.questions.length) {
    const firstActive = snap.current_focus && snap.current_focus.length ? snap.current_focus[0].challenge_id : snap.questions[0].id;
    selectedQid = firstActive;
  }

  renderKpiRow();

  // Taxonomy Matrix (D06)
  const tax = snap.taxonomy || {};
  document.getElementById('taxonomyHeadline').textContent = tax.headline || '场景分类覆盖矩阵';
  document.getElementById('btnToggleTax').textContent = showAllCanonical8 ? '仅看本场已纳入' : '对照完整八大类';
  const catItems = showAllCanonical8
    ? [...(tax.canonical_categories || []), ...(tax.extra_categories || [])]
    : (tax.active_categories || []);
  document.getElementById('catBar').innerHTML = catItems.map(c => {
    if (!c.included) {
      return `<div class="cat-pill excluded">
        <div class="cname"><span>${esc(c.category)}</span><span class="badge b-muted">未纳入</span></div>
        <div class="cmeta"><span>本场无题目</span><span>不计入分母</span></div>
        <div class="progress na"><div style="width:0%"></div></div>
      </div>`;
    }
    const hasFlags = c.total_flags > 0;
    const pct = hasFlags ? Math.round((c.solved_flags / c.total_flags) * 100) : (c.total_q > 0 ? Math.round((c.solved_q / c.total_q) * 100) : 0);
    const rightMetric = hasFlags
      ? `Flag ${c.solved_flags}/${c.total_flags} (${pct}%)`
      : `非Flag题 ${c.non_flag_solved}/${c.non_flag_q}`;
    return `<div class="cat-pill">
      <div class="cname"><span>${esc(c.category)}</span>${!c.is_canonical ? '<span class="badge b-purple">扩展类</span>' : ''}</div>
      <div class="cmeta"><span>题 ${c.solved_q}/${c.total_q}</span><span>${rightMetric}</span></div>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  // Update global event question filter options without clobbering choice
  const feedQSel = document.getElementById('feedQFilter');
  const prevFeedQ = feedQSel.value;
  feedQSel.innerHTML = `<option value="all">全部题目</option>` +
    (snap.questions || []).map(q => `<option value="${esc(q.id)}">${esc(q.id)} · ${esc(q.name)}</option>`).join('');
  if ([...feedQSel.options].some(o => o.value === prevFeedQ)) feedQSel.value = prevFeedQ;

  renderQueue();
  renderCurrentFocus();
  renderDetail();
  renderConnections();
  renderProxyTelemetry();
  renderAudit();
  renderGlobalFeed();
}

function renderKpiRow() {
  if (!latestSnap) return;
  const sum = latestSnap.summary || {};
  const a = latestSnap.audit || {};
  const leaks = (a.credential_leaks || []).length;
  const rateHits = a.rate_limit_hits || 0;
  const capHits = a.scene_limit_hits || 0;
  const complianceOk = leaks === 0 && rateHits === 0 && capHits === 0;
  const rankedHtml = sum.simulate_competitors && isNum(sum.ranked_score)
    ? `<span style="font-size:13px;color:var(--ok)">(排名分 ${sum.ranked_score})</span>`
    : `<span style="font-size:11px;color:var(--muted)">(排名仿真未启用)</span>`;

  // KPI Card 2: Selected challenge's exact Flag solved count & completion percentage!
  const selQ = (latestSnap.questions || []).find(x => x.id === selectedQid) || (latestSnap.questions || [])[0];
  let selFlagLabel = '当前选中题 Flag 进度';
  let selFlagVal = '未选题';
  let selFlagPct = 0;
  let selFlagBarCls = 'na';
  let selFlagSub = `全场累计 Flag ${sum.solved_flags || 0}/${sum.total_flags || 0}`;
  if (selQ) {
    const v = selQ.states.verdict || {};
    selFlagLabel = `选中题 [${selQ.id}] Flag 进度`;
    if (v.type === 'flag' && isNum(v.total) && v.total > 0) {
      selFlagPct = isNum(v.pct) ? v.pct : Math.round(((v.solved || 0) / v.total) * 100);
      selFlagVal = `${v.solved} / ${v.total} <span style="font-size:14px;color:var(--accent)">(${selFlagPct}%)</span>`;
      selFlagBarCls = '';
      selFlagSub = `${selQ.name} · 全场累计 ${sum.solved_flags || 0}/${sum.total_flags || 0}`;
    } else if (v.type === 'poc' || v.type === 'attachment') {
      selFlagLabel = `选中题 [${selQ.id}] 里程碑进度`;
      selFlagPct = isNum(v.pct) ? v.pct : 0;
      selFlagVal = `${esc(v.short_label)} <span style="font-size:14px;color:var(--accent)">(${selFlagPct}%)</span>`;
      selFlagBarCls = '';
      selFlagSub = `非 Flag 题 · 全场累计 Flag ${sum.solved_flags || 0}/${sum.total_flags || 0}`;
    } else {
      selFlagVal = '判定未配置';
      selFlagSub = `${selQ.name} · 不适用 Flag 占比`;
    }
  }

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi">
      <div class="label"><span>全场总分 / 整题完成</span></div>
      <div class="val accent">${fmtNum(sum.total_score, '0')} ${rankedHtml}</div>
      <div class="sub">全场整题全解 ${sum.solved_questions}/${sum.total_questions} 题</div>
    </div>
    <div class="kpi" style="border-color:rgba(56,189,248,0.45);">
      <div class="label"><span>${esc(selFlagLabel)}</span><span>${selQ ? esc(selQ.canonical_category) : ''}</span></div>
      <div class="val ok">${selFlagVal}</div>
      <div class="progress ${selFlagBarCls}" style="margin-top:5px;"><div style="width:${selFlagPct}%"></div></div>
      ${selQ && (selQ.obtained_flags || []).length ? `<div class="qflag-preview" style="margin-top:4px;font-size:11px;" title="${esc(selQ.obtained_flags.map(f => `${f.flag_label || 'Flag'}: ${f.flag}`).join('\n'))}">✓ ${esc(selQ.obtained_flags.map(f => f.flag).join(' · '))}</div>` : ''}
      <div class="sub">${esc(selFlagSub)}</div>
    </div>
    <div class="kpi">
      <div class="label"><span>全场波次放出</span></div>
      <div class="val">${sum.visible_questions} / ${sum.total_questions}</div>
      <div class="sub">${sum.unreleased_questions > 0 ? `下一波约 ${fmtDuration(sum.next_release_in_sec)} 后放出` : '全部题目已放出'}</div>
    </div>
    <div class="kpi">
      <div class="label"><span>全场靶机槽位</span><span>焦点: ${(latestSnap.current_focus||[]).length}</span></div>
      <div class="val ${sum.running_scenes >= sum.max_scenes ? 'warn' : 'accent'}">${sum.running_scenes} / ${sum.max_scenes}</div>
      <div class="sub">附件槽: ${latestSnap.orchestrator && latestSnap.orchestrator.available ? `${latestSnap.orchestrator.active_attachments ?? 0}/${latestSnap.orchestrator.max_attachments ?? '?'}` : '总控未接入'}</div>
    </div>
    <div class="kpi">
      <div class="label"><span>全场合规与调用口径</span></div>
      <div class="val ${complianceOk ? 'ok' : 'err'}">${complianceOk ? 'PASS' : 'WARN'}</div>
      <div class="sub">API/MCP:${(a.total_api_calls||0)+(a.total_mcp_calls||0)}（不含看板轮询）· 泄密:${leaks} · 限流:${rateHits}</div>
    </div>
  `;
}

// === Left Column: Keyboard-Accessible Queue (D10) ===
function setQFilter(f) {
  qFilter = f;
  document.querySelectorAll('.chip[data-qfilter]').forEach(el => {
    el.classList.toggle('active', el.dataset.qfilter === f);
  });
  renderQueue();
}

function renderQueue() {
  if (!latestSnap) return;
  const term = (document.getElementById('qSearch').value || '').trim().toLowerCase();
  const qs = (latestSnap.questions || []).filter(q => {
    if (qFilter === 'active' && !['running', 'external_active'].includes(q.states.schedule.code) && !['starting', 'running'].includes(q.states.env.code)) return false;
    if (qFilter === 'unsolved' && q.complete) return false;
    if (qFilter === 'solved' && !q.complete) return false;
    if (qFilter === 'fault' && q.states.env.code !== 'failed' && q.states.schedule.code !== 'exhausted' && !(q.stall && q.stall.level !== 'ok')) return false;
    if (term) {
      const hay = `${q.id} ${q.name} ${q.category} ${q.canonical_category} ${q.direction}`.toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  document.getElementById('qCount').textContent = `显示 ${qs.length} / ${(latestSnap.questions || []).length}`;
  const grid = document.getElementById('qGrid');
  const prevScroll = grid.scrollTop;
  const activeElId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.qid : null;

  grid.innerHTML = qs.map(q => {
    const [eCls, eTxt] = envBadge(q.states.env);
    const [sCls, sTxt] = schedBadge(q.states.schedule);
    const [wCls, wTxt] = workerBadge(q.states.worker);
    const [vCls, vTxt] = verdictBadge(q.states.verdict);
    const diffName = ({1:'简单', 2:'中等', 3:'困难'})[q.difficulty] || `D${q.difficulty}`;
    const isSel = selectedQid === q.id;
    const pct = isNum(q.states.verdict.pct) ? q.states.verdict.pct : 0;
    const stopHint = q.skipped
      ? '已人工跳过/止损'
      : (q.states.env.code === 'stopped' && q.states.env.last_stop_reason
        ? `停机: ${q.states.env.last_stop_reason}`
        : (q.timers.current_attempt_sec !== null ? `本次 ${fmtDuration(q.timers.current_attempt_sec)}` : `累计 ${fmtDuration(q.timers.cumulative_active_sec)}`));
    const stall = q.stall || { level: 'ok' };
    const stallHtml = stall.level === 'critical'
      ? `<span class="badge b-err" title="${esc((stall.reasons||[]).join('；'))}">⚠ ${esc(stall.label)}</span>`
      : (stall.level === 'warn' ? `<span class="badge b-warn" title="${esc((stall.reasons||[]).join('；'))}">⚠ ${esc(stall.label)}</span>` : '');
    const skipHtml = q.skipped ? '<span class="badge b-warn">已跳过</span>' : '';
    const u = q.llm_usage;
    const llmHint = u && u.calls ? `LLM:${u.calls}轮/${u.tool_calls||0}工具` : `Attempt:${(q.attempts||[]).length}${q.reopen_count ? `·R${q.reopen_count}` : ''}`;
    const qFlags = q.obtained_flags || [];
    const qFlagLine = qFlags.length
      ? `<div class="qflag-preview" title="${esc(qFlags.map(f => `${f.flag_label || 'Flag'}: ${f.flag}`).join('\n'))}">✓ ${esc(qFlags[0].flag)}${qFlags.length > 1 ? ` (+${qFlags.length - 1})` : ''}</div>`
      : '';

    return `<button type="button" class="qcard ${q.complete ? 'solved' : ''} ${isSel ? 'selected' : ''}"
        data-qid="${esc(q.id)}" aria-pressed="${isSel ? 'true' : 'false'}"
        aria-label="${esc(`${q.id} ${q.name}, ${sTxt}, ${eTxt}, ${vTxt}`)}"
        onclick="selectQuestion('${esc(q.id)}')">
      <div class="qhead">
        <div>
          <div class="qtitle">[${esc(q.id)}] ${esc(q.name)}</div>
          <div class="qsub">${esc(q.canonical_category)} · ${diffName} · ${q.score} 分</div>
        </div>
        <span class="badge ${vCls}">${esc(vTxt)}</span>
      </div>
      <div class="state-row">
        <span class="badge ${sCls}" title="调度状态">${esc(sTxt)}</span>
        <span class="badge ${eCls}" title="环境状态">${esc(eTxt)}</span>
        <span class="badge ${wCls}" title="Worker 状态">${esc(wTxt)}</span>
        ${stallHtml}${skipHtml}
      </div>
      <div class="progress ${q.states.verdict.pct === null ? 'na' : ''}"><div style="width:${pct}%"></div></div>
      ${qFlagLine}
      <div class="qfooter">
        <span>${esc(stopHint)}</span>
        <span>${esc(llmHint)}</span>
      </div>
    </button>`;
  }).join('') || '<div class="muted" style="padding:12px;text-align:center">当前筛选条件下无题目</div>';

  grid.scrollTop = prevScroll;
  if (activeElId) {
    const restore = grid.querySelector(`button.qcard[data-qid="${CSS.escape(activeElId)}"]`);
    if (restore) restore.focus({ preventScroll: true });
  }
}

function selectQuestion(qid) {
  selectedQid = qid;
  renderKpiRow();
  renderQueue();
  renderDetail();
}

// === Center Top: Pinned Current Execution Focus (D07, Section 5-6) ===
function renderCurrentFocus() {
  if (!latestSnap) return;
  const list = latestSnap.current_focus || [];
  const badge = document.getElementById('focusCountBadge');
  const switcher = document.getElementById('focusSwitcher');
  const body = document.getElementById('focusBody');

  if (!list.length) {
    badge.className = 'badge b-muted';
    badge.textContent = '当前空闲';
    switcher.innerHTML = '';
    const idle = latestSnap.idle_diagnosis || {};
    const lastEv = idle.last_activity;
    body.innerHTML = `<div class="idle-box">
      <div><b>空闲原因：</b>${esc(idle.reason || '当前无活跃解题任务')}</div>
      <div><b>下次调度条件：</b>${esc(idle.next_condition || '等待新任务或调度器启动')}</div>
      <div><b>最后活动：</b>${lastEv ? `[${esc(fmtClockTime(lastEv.observed_at))}] ${esc(lastEv.message)}` : '尚无活动记录'}</div>
    </div>`;
    return;
  }

  badge.className = 'badge b-run';
  badge.textContent = `${list.length} 个任务执行中`;
  if (!selectedFocusQid || !list.some(f => f.challenge_id === selectedFocusQid)) {
    selectedFocusQid = list[0].challenge_id;
  }
  switcher.innerHTML = list.map(f =>
    `<button type="button" class="chip ${f.challenge_id === selectedFocusQid ? 'active' : ''}" onclick="selectedFocusQid='${esc(f.challenge_id)}';selectQuestion('${esc(f.challenge_id)}');renderCurrentFocus();">${esc(f.challenge_id)}</button>`
  ).join('');

  const cur = list.find(f => f.challenge_id === selectedFocusQid) || list[0];
  const st = cur.states;
  const tm = cur.timers;
  const mt = latestSnap.model_telemetry || {};
  const activeRoute = mt.available ? mt.active : null;
  const modelText = activeRoute
    ? `${activeRoute.requested_model || '未知'} / ${activeRoute.version_label}`
    : '代理未连接（未知）';
  const thinkingText = activeRoute ? activeRoute.thinking_effort : '未知/未连接';
  const resText = cur.resources && cur.resources.available
    ? cur.resources.containers.map(c => `${c.cpu_perc || '?'} CPU · ${c.mem_usage || '?'}`).join(' | ')
    : (cur.resources && cur.resources.note ? `未采集（${cur.resources.note}）` : '未采集/未知');
  const lastFactText = cur.last_fact ? `[${cur.last_fact.id}] ${cur.last_fact.description}` : '暂无 Cairn Fact（若 Cairn 离线属预期）';
  const nextPlan = cur.active_intent ? `[${cur.active_intent.id}] ${cur.active_intent.description}` : (st.worker.waiting_reason || '等待下一条调度或推理结论');

  const stall = cur.stall || { level: 'ok', label: '推进正常', reasons: [] };
  const u = cur.llm_usage;
  const qTokText = u
    ? `${fmtNum(u.calls)} 轮 · ${fmtNum(u.tool_calls)} 工具 · ${fmtNum((u.input||0)+(u.output||0))} tok`
    : '未归因/尚无调用';
  const stallBadgeHtml = stall.level === 'critical'
    ? `<span class="badge b-err">⚠ ${esc(stall.label)}</span>`
    : (stall.level === 'warn' ? `<span class="badge b-warn">⚠ ${esc(stall.label)}</span>` : `<span class="badge b-ok">${esc(stall.label)}</span>`);
  const lastToolOrPlan = (u && u.last_tool) ? u.last_tool : nextPlan;

  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <div>
        <strong style="font-size:14px;">[${esc(cur.challenge_id)}] ${esc(cur.name)}</strong>
        <span class="muted" style="margin-left:8px;">Attempt: <b>${esc(cur.attempt_id || '未创建')}</b> · 项目: ${esc(cur.project_id || '未关联')}</span>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;">
        <span class="badge ${schedBadge(st.schedule)[0]}">${esc(schedBadge(st.schedule)[1])}</span>
        <span class="badge ${envBadge(st.env)[0]}">${esc(envBadge(st.env)[1])}</span>
        <span class="badge ${workerBadge(st.worker)[0]}">${esc(workerBadge(st.worker)[1])}</span>
        ${stallBadgeHtml}
        <span class="badge ${verdictBadge(st.verdict)[0]}">${esc(verdictBadge(st.verdict)[1])}</span>
        <button type="button" onclick="selectQuestion('${esc(cur.challenge_id)}')">查看详情</button>
      </div>
    </div>
    <div class="focus-grid">
      <div class="fcell"><div class="flabel">本次 Attempt / 累计投入</div><div class="fval accent">${fmtDuration(tm.current_attempt_sec, '未计时')} · ${fmtDuration(tm.cumulative_active_sec, '00:00:00')}</div></div>
      <div class="fcell"><div class="flabel">预算剩余 / 无进展时长</div><div class="fval">${tm.budget_remaining_sec !== null ? fmtDuration(tm.budget_remaining_sec) : '未配预算'} · ${tm.no_progress_sec !== null ? fmtDuration(tm.no_progress_sec) : '无记录'}</div></div>
      <div class="fcell"><div class="flabel">单题 LLM 消耗与停滞雷达</div><div class="fval ${stall.level === 'critical' ? 'err' : (stall.level === 'warn' ? 'warn' : '')}">${esc(qTokText)}${stall.reasons && stall.reasons.length ? ` · ${esc(stall.reasons[0])}` : ''}</div></div>
      <div class="fcell"><div class="flabel">模型（请求 / 实际版本 / 思考）</div><div class="fval">${esc(modelText)} · ${esc(thinkingText)}</div></div>
      <div class="fcell"><div class="flabel">容器资源（CPU / 内存）</div><div class="fval">${esc(resText)}</div></div>
      <div class="fcell"><div class="flabel">最近工具 / 下一步计划</div><div class="fval">${esc(lastToolOrPlan.slice(0, 120))}</div></div>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted);"><b>最后有效进展：</b>${esc(lastFactText.slice(0, 260))}</div>
  `;
}

// === Center Bottom: Selected Challenge Workspace (Tabs 1..8) ===
function setDetailTab(tab) {
  activeDetailTab = tab;
  ['exec', 'dag', 'tools', 'llm', 'verdict', 'decisions', 'resources', 'humanref'].forEach(t => {
    const el = document.getElementById(`tab-${t}`);
    if (el) el.setAttribute('aria-selected', t === tab ? 'true' : 'false');
  });
  const container = document.getElementById('detailTabContent');
  if (container) {
    delete container.dataset.dagRenderKey;
    delete container.dataset.toolsRenderKey;
    delete container.dataset.llmRenderKey;
  }
  renderDetail();
}

function toggleBudgetStrip() {
  budgetExpanded = !budgetExpanded;
  if (latestSnap) renderDetail();
}

function renderDetailBudgets(q) {
  const host = document.getElementById('detailBudgetStrip');
  if (!host) return;
  const v = q.states.verdict || {};
  const flagTxt = (v.type === 'flag' && isNum(v.total) && v.total > 0)
    ? `本题 Flag ${v.solved}/${v.total} (${isNum(v.pct) ? v.pct : Math.round((v.solved / v.total) * 100)}%)`
    : (v.label || v.short_label || '判定未配置');
  const budgets = q.budgets || [];
  const warnCnt = budgets.filter(b => b.level === 'warn' || b.level === 'critical').length;
  const statusBadge = warnCnt
    ? `<span class="badge b-warn">${warnCnt} 项接近上限</span>`
    : '<span class="badge b-ok">预算充裕</span>';
  const obtainedHtml = renderObtainedFlagsBox(q, `[${q.id}] `);

  if (!budgetExpanded) {
    const brief = budgets.slice(0, 3).map(b => `${b.label} ${b.used_text}/${b.limit_text}${isNum(b.pct) ? ` (${b.pct}%)` : ''}`).join(' · ');
    host.innerHTML = `${obtainedHtml}<div class="budget-strip" style="padding:7px 12px;">
      <div class="budget-head" style="margin-bottom:0;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <b style="font-size:12px;">单题预算分配进度</b>
          <span class="badge b-run">${esc(flagTxt)}</span>
          ${statusBadge}
          <span class="muted" style="font-size:11px;">${esc(brief)}</span>
        </div>
        <button type="button" style="padding:2px 8px;font-size:11px;" onclick="toggleBudgetStrip()">展开进度表</button>
      </div>
    </div>`;
    return;
  }

  const rowsHtml = budgets.map(b => {
    const pctTxt = isNum(b.pct) ? `${b.pct}%` : '未设上限';
    const pctCls = b.level === 'critical' ? 'err' : (b.level === 'warn' ? 'warn' : (b.configured ? 'accent' : 'muted'));
    const barW = isNum(b.pct) ? Math.min(100, Math.max(0, b.pct)) : 0;
    return `<tr>
      <td><b>${esc(b.label)}</b></td>
      <td><code>${esc(b.used_text)}</code></td>
      <td class="muted">${esc(b.limit_text)}</td>
      <td class="${pctCls}"><b>${esc(pctTxt)}</b></td>
      <td><div class="bbar ${esc(b.level)}"><div style="width:${barW}%"></div></div></td>
      <td class="muted" style="font-size:11px;">${esc(b.note || '')}</td>
    </tr>`;
  }).join('');

  host.innerHTML = `${obtainedHtml}<div class="budget-strip">
    <div class="budget-head">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <b style="font-size:12px;">[${esc(q.id)}] 单题预算分配进度表</b>
        <span class="badge b-run">${esc(flagTxt)}</span>
        ${statusBadge}
      </div>
      <button type="button" style="padding:2px 8px;font-size:11px;" onclick="toggleBudgetStrip()">收起</button>
    </div>
    <div class="table-wrap">
      <table class="budget-table">
        <thead><tr><th>预算维度</th><th>已消耗</th><th>分配上限</th><th>占比</th><th>进度条</th><th>说明</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>`;
}

function renderDetail() {
  if (!latestSnap || !selectedQid) {
    document.getElementById('detailTabContent').innerHTML = '<div class="muted">请从左侧题目队列选择一道题目。</div>';
    const bs = document.getElementById('detailBudgetStrip');
    if (bs) bs.innerHTML = '';
    return;
  }
  const q = (latestSnap.questions || []).find(x => x.id === selectedQid);
  if (!q) return;

  const st = q.states;
  document.getElementById('detailTitle').textContent = `[${q.id}] ${q.name}`;
  document.getElementById('detailSub').textContent =
    `${q.canonical_category}（原方向: ${q.direction}） · D${q.difficulty} · ${q.score} 分 · 调度:${st.schedule.label} · 环境:${st.env.label} · Worker:${st.worker.label}`;

  document.getElementById('detailActions').innerHTML = `
    <button type="button" class="btn-warn" onclick="openSkipModal('${esc(q.id)}')">跳过/止损</button>
    <button type="button" onclick="openResetQModal('${esc(q.id)}')">重跑单题</button>
    ${q.has_scene ? `<button type="button" onclick="openFaultModal('${esc(q.id)}')">预设故障</button>` : ''}
    <button type="button" onclick="openNoteModal('${esc(q.id)}')">备注</button>
  `;

  renderDetailBudgets(q);

  const container = document.getElementById('detailTabContent');
  if (activeDetailTab === 'exec') renderTabExec(q, container);
  else if (activeDetailTab === 'dag') renderTabDag(q, container);
  else if (activeDetailTab === 'tools') renderTabTools(q, container);
  else if (activeDetailTab === 'llm') renderTabLlm(q, container);
  else if (activeDetailTab === 'verdict') renderTabVerdict(q, container);
  else if (activeDetailTab === 'decisions') renderTabDecisions(q, container);
  else if (activeDetailTab === 'resources') renderTabResources(q, container);
  else if (activeDetailTab === 'humanref') renderTabHumanRef(q, container);
}

function renderTabExec(q, container) {
  const attempts = q.attempts || [];
  let selAttId = selectedAttemptByQid[q.id] || 'all';
  if (selAttId !== 'all' && !attempts.some(a => a.attempt_id === selAttId)) selAttId = 'all';

  const attOptions = `<option value="all">全部 Attempt (${attempts.length} 次)</option>` +
    attempts.slice().reverse().map(a =>
      `<option value="${esc(a.attempt_id)}" ${selAttId === a.attempt_id ? 'selected' : ''}>${esc(a.attempt_id)} (${esc(a.status)} · ${fmtDuration(a.duration_sec, '进行中')})</option>`
    ).join('');

  // D05: Address hygiene rendering
  const addrsHtml = (q.addresses && q.addresses.length)
    ? `<div class="table-wrap" style="margin-bottom:10px;"><table class="tbl"><thead><tr><th>协议</th><th>绑定/内部目标</th><th>映射端口</th><th>操作者可达入口</th><th>说明</th></tr></thead><tbody>` +
      q.addresses.map(a => `<tr>
        <td>${esc(a.protocol)}</td>
        <td><code>${esc(a.internal_target)}</code></td>
        <td>${esc(a.mapped_port ?? '未知')}</td>
        <td>${a.operator_url ? (a.clickable ? `<a href="${esc(a.operator_url)}" target="_blank" rel="noopener">${esc(a.operator_url)}</a>` : `<code>${esc(a.operator_url)}</code>`) : '<span class="warn">未配置可达主机</span>'}</td>
        <td class="muted">${esc(a.reachability_note)}</td>
      </tr>`).join('') + `</tbody></table></div>`
    : `<div class="kv-card" style="margin-bottom:10px;"><div class="k">目标入口地址</div><div class="v muted">${q.has_scene ? `当前环境状态为「${esc(q.states.env.label)}」，无运行中入口` : '纯附件题（无在线靶机入口）'}</div></div>`;

  // D02: Environment history when stopped
  const envHistoryHtml = q.states.env.code === 'stopped'
    ? `<div class="kv-card" style="margin-bottom:10px;border-color:rgba(143,162,200,0.4);">
        <div class="k">最近停止说明（已区分「已停止」与「从未启动」）</div>
        <div class="v">停止原因：${esc(q.states.env.last_stop_reason || '未记录')} · 停止时间：${esc(fmtClockTime(q.states.env.last_stopped_at_iso))} · 累计执行 ${fmtDuration(q.timers.cumulative_active_sec)}</div>
      </div>`
    : '';

  // Cairn Facts & Intents
  const cairnConn = (latestSnap.connections || {}).cairn || {};
  const factsHtml = q.cairn && q.cairn.recent_facts && q.cairn.recent_facts.length

      <div><div class="panel-title" style="font-size:12px;margin-bottom:4px;">执行意图与阶段（Intents）</div>${intentsHtml}</div>
      <div>
