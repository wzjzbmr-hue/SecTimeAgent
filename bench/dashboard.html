// === Tab 2: Lightweight On-Demand Fact-Intent DAG (Zero Solving Overhead) ===
function computeDagSignature(q) {
  const c = q.cairn || {};
  const cairnStatus = ((latestSnap && latestSnap.connections && latestSnap.connections.cairn) || {}).status || 'unknown';
  const reasonTag = c.reason ? `${c.reason.worker || ''}:${c.reason.started_at || ''}` : '';
  return `${q.project_id || ''}|${c.fact_count || 0}|${c.intent_count || 0}|${c.working_intent_count || 0}|${c.status || ''}|${reasonTag}|${cairnStatus}`;
}

async function fetchChallengeDag(qid, sig, force = false) {
  if (dagInflightQid === qid && !force) return;
  dagInflightQid = qid;
  try {
    const r = await fetch(`/api/dashboard/dag/${encodeURIComponent(qid)}?force=${force ? 1 : 0}`);
    const data = await r.json();
    dagCacheByQid[qid] = data;
    dagSigByQid[qid] = sig;
  } catch (e) {
    dagCacheByQid[qid] = { available: false, status: 'error', reason: `图谱拉取异常：${e.message}`, nodes: [], edges: [] };
  } finally {
    if (dagInflightQid === qid) dagInflightQid = null;
    const container = document.getElementById('detailTabContent');
    if (container) delete container.dataset.dagRenderKey;
    if (activeDetailTab === 'dag' && selectedQid === qid) renderDetail();
  }
}

function layoutDagGraph(nodes, edges, dir) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const parents = new Map(nodes.map(n => [n.id, []]));
  const children = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) {
    if (byId.has(e.from) && byId.has(e.to) && e.from !== e.to) {
      children.get(e.from).push(e.to);
      parents.get(e.to).push(e.from);
    }
  }

  // Longest-path topological layering (bounded iterations for cycle safety)
  const layer = new Map(nodes.map(n => [n.id, 0]));
  const maxIter = Math.min(nodes.length + 2, 64);
  for (let iter = 0; iter < maxIter; iter++) {
    let changed = false;
    for (const e of edges) {
      if (!layer.has(e.from) || !layer.has(e.to) || e.from === e.to) continue;
      const cand = layer.get(e.from) + 1;
      if (cand > layer.get(e.to) && cand < maxIter) {
        layer.set(e.to, cand);
        changed = true;
      }
    }
    if (!changed) break;
  }

  // Keep 'origin' on layer 0 and detached 'goal' at the terminal layer for readability
  if (layer.has('origin')) layer.set('origin', 0);
  let maxL = 0;
  for (const [id, lv] of layer.entries()) {
    if (id !== 'goal' && lv > maxL) maxL = lv;
  }
  if (layer.has('goal') && (parents.get('goal') || []).length === 0) {
    layer.set('goal', Math.max(1, maxL));
  }

  const buckets = new Map();
  for (const n of nodes) {
    const lv = layer.get(n.id) || 0;
    if (!buckets.has(lv)) buckets.set(lv, []);
    buckets.get(lv).push(n);
  }
  const sortedLayers = Array.from(buckets.keys()).sort((a, b) => a - b);

  // Barycenter ordering within each layer to reduce edge crossings
  const orderIndex = new Map();
  for (const lv of sortedLayers) {
    const arr = buckets.get(lv);
    arr.sort((a, b) => {
      const pa = (parents.get(a.id) || []).map(p => orderIndex.get(p)).filter(v => v !== undefined);
      const pb = (parents.get(b.id) || []).map(p => orderIndex.get(p)).filter(v => v !== undefined);
      const ma = pa.length ? pa.reduce((s, v) => s + v, 0) / pa.length : 1e6;
      const mb = pb.length ? pb.reduce((s, v) => s + v, 0) / pb.length : 1e6;
      if (ma !== mb) return ma - mb;
      return a.id.localeCompare(b.id);
    });
    arr.forEach((n, idx) => orderIndex.set(n.id, idx));
  }

  const nw = dir === 'LR' ? 214 : 220;
  const nh = dir === 'LR' ? 72 : 70;
  const gx = dir === 'LR' ? 66 : 28;
  const gy = dir === 'LR' ? 24 : 56;
  const pad = 28;
  const pos = new Map();
  let maxX = 0;
  let maxY = 0;

  if (dir === 'LR') {
    const maxRows = Math.max(1, ...sortedLayers.map(lv => buckets.get(lv).length));
    const totalH = maxRows * nh + (maxRows - 1) * gy;
    sortedLayers.forEach((lv, ci) => {
      const arr = buckets.get(lv);
      const colH = arr.length * nh + (arr.length - 1) * gy;
      const yOff = pad + Math.max(0, (totalH - colH) / 2);
      const x = pad + ci * (nw + gx);
      arr.forEach((n, ri) => {
        const y = yOff + ri * (nh + gy);
        pos.set(n.id, { x, y, w: nw, h: nh });
        maxX = Math.max(maxX, x + nw + pad);
        maxY = Math.max(maxY, y + nh + pad);
      });
    });
  } else {
    const maxCols = Math.max(1, ...sortedLayers.map(lv => buckets.get(lv).length));
    const totalW = maxCols * nw + (maxCols - 1) * gx;
    sortedLayers.forEach((lv, ri) => {
      const arr = buckets.get(lv);
      const rowW = arr.length * nw + (arr.length - 1) * gx;
      const xOff = pad + Math.max(0, (totalW - rowW) / 2);
      const y = pad + ri * (nh + gy);
      arr.forEach((n, ci) => {
        const x = xOff + ci * (nw + gx);
        pos.set(n.id, { x, y, w: nw, h: nh });
        maxX = Math.max(maxX, x + nw + pad);
        maxY = Math.max(maxY, y + nh + pad);
      });
    });
  }

  return { pos, parents, children, width: Math.max(360, maxX), height: Math.max(220, maxY) };
}

function dagNodeVisual(n) {
  if (n.kind === 'origin') return { fill: '#191a38', stroke: '#a78bfa', hdr: '#a78bfa', tag: 'Origin 起点', dash: '' };
  if (n.kind === 'goal') return { fill: '#191a38', stroke: '#c084fc', hdr: '#c084fc', tag: 'Goal 目标', dash: '' };
  if (n.kind === 'fact') {
    if (n.has_flag_hint) return { fill: '#0d281f', stroke: '#4ade80', hdr: '#4ade80', tag: 'Fact · 含Flag', dash: '' };
    if (n.is_hypothesis) return { fill: '#271e0d', stroke: '#f59e0b', hdr: '#fbbf24', tag: 'Fact · 假设', dash: '5 3' };
    return { fill: '#0e221b', stroke: '#22c55e', hdr: '#4ade80', tag: 'Fact 已验证', dash: '' };
  }
  // intent
  if (n.status === 'working') return { fill: '#0c2236', stroke: '#38bdf8', hdr: '#38bdf8', tag: `执行中 · ${n.worker || 'Worker'}`, dash: '' };
  if (n.status === 'unclaimed') return { fill: '#251d0d', stroke: '#f59e0b', hdr: '#fbbf24', tag: '待认领 Intent', dash: '6 4' };
  return { fill: '#141d34', stroke: '#64748b', hdr: '#94a3b8', tag: '已完成 Intent', dash: '' };
}

function applyDagTransform() {
  const g = document.getElementById('dagTransformGroup');
  if (g) g.setAttribute('transform', `translate(${dagPan.x.toFixed(1)}, ${dagPan.y.toFixed(1)}) scale(${dagZoom.toFixed(3)})`);
  const zLbl = document.getElementById('dagZoomLabel');
  if (zLbl) zLbl.textContent = `${Math.round(dagZoom * 100)}%`;
}

function fitDagView() {
  const vp = document.getElementById('dagViewport');
  if (!vp) return;
  const vw = vp.clientWidth || 720;
  const vh = vp.clientHeight || 470;
  const cw = dagLastCanvasSize.w || 720;
  const ch = dagLastCanvasSize.h || 360;
  dagZoom = Math.max(0.15, Math.min(1.15, Math.min((vw - 24) / cw, (vh - 24) / ch)));
  dagPan = {
    x: Math.max(12, (vw - cw * dagZoom) / 2),
    y: Math.max(12, (vh - ch * dagZoom) / 2),
  };
  applyDagTransform();
}

function adjustDagZoom(delta) {
  dagZoom = Math.max(0.15, Math.min(2.4, dagZoom + delta));
  applyDagTransform();
}

function toggleDagExpand() {
  dagExpanded = !dagExpanded;
  const vp = document.getElementById('dagViewport');
  if (vp) vp.classList.toggle('expanded', dagExpanded);
  const closeBtn = document.getElementById('dagExpandCloseBtn');
  if (closeBtn) closeBtn.style.display = dagExpanded ? 'inline-block' : 'none';
  const btn = document.getElementById('btnDagExpand');
  if (btn) btn.textContent = dagExpanded ? '退出全屏' : '放大展开';
  setTimeout(fitDagView, 20);
}

function setDagLayoutDir(dir) {
  dagLayoutDir = dir;
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.dagRenderKey;
  renderDetail();
  setTimeout(fitDagView, 0);
}

function selectDagNode(qid, nodeId) {
  dagSelectedNodeByQid[qid] = nodeId;
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.dagRenderKey;
  renderDetail();
}

let dagDragState = null;
function bindDagPanZoom() {
  const vp = document.getElementById('dagViewport');
  if (!vp || vp.dataset.bound) return;
  vp.dataset.bound = '1';
  vp.addEventListener('pointerdown', ev => {
    if (ev.target && ev.target.closest && (ev.target.closest('.dag-node') || ev.target.closest('button'))) return;
    dagDragState = { pid: ev.pointerId, sx: ev.clientX, sy: ev.clientY, ox: dagPan.x, oy: dagPan.y };
    vp.classList.add('dragging');
    try { vp.setPointerCapture(ev.pointerId); } catch (_) {}
  });
  vp.addEventListener('pointermove', ev => {
    if (!dagDragState) return;
    dagPan.x = dagDragState.ox + (ev.clientX - dagDragState.sx);
    dagPan.y = dagDragState.oy + (ev.clientY - dagDragState.sy);
    applyDagTransform();
  });
  const endDrag = () => {
    if (!dagDragState) return;
    dagDragState = null;
    vp.classList.remove('dragging');
  };
  vp.addEventListener('pointerup', endDrag);
  vp.addEventListener('pointercancel', endDrag);
  vp.addEventListener('wheel', ev => {
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 0.12 : -0.12;
    dagZoom = Math.max(0.15, Math.min(2.4, dagZoom + factor));
    applyDagTransform();
  }, { passive: false });
}

function renderTabDag(q, container) {
  const sig = computeDagSignature(q);
  const cached = dagCacheByQid[q.id];
  const needFetch = !cached || dagSigByQid[q.id] !== sig;
  if (needFetch) {
    fetchChallengeDag(q.id, sig, false);
  }

  const selNodeId = dagSelectedNodeByQid[q.id] || '';
  const renderKey = `${q.id}|${sig}|${cached ? (cached.observed_at || '') : 'loading'}|${dagLayoutDir}|${selNodeId}`;
  if (container.dataset.dagRenderKey === renderKey) {
    return;
  }
  container.dataset.dagRenderKey = renderKey;

  if (!cached) {
    container.innerHTML = `<div class="kv-card"><div class="k">解题过程 DAG（按需拉取，不增加 Worker 解题开销）</div><div class="v muted">正在从 Cairn 读取本题 Fact-Intent 图谱...</div></div>`;
    return;
  }

  if (!cached.available) {
    container.innerHTML = `
      <div class="dag-toolbar">
        <div class="dag-tools-group">
          <span class="badge b-muted">状态：${esc(cached.status || 'unavailable')}</span>
          <span class="muted" style="font-size:11px;">按需拉取模式：仅打开本标签且节点变化时才查询，零解题开销</span>
        </div>
        <button type="button" onclick="fetchChallengeDag('${esc(q.id)}', '${esc(sig)}', true)">重试拉取</button>
      </div>
      <div class="diag-banner ${cached.status === 'disconnected' || cached.status === 'error' ? 'error' : 'info'}">
        <div>
          <b>当前无法展示本题解题 DAG</b>
          <span>${esc(cached.reason || '未获取到图谱数据')}${cached.recovery_hint ? `（建议：${esc(cached.recovery_hint)}）` : ''}</span>
        </div>
      </div>`;
    return;
  }

  const nodes = cached.nodes || [];
  const edges = cached.edges || [];
  const stats = cached.stats || {};
  const layout = layoutDagGraph(nodes, edges, dagLayoutDir);
  const prevSizeKey = `${q.id}|${dagLayoutDir}|${nodes.length}`;
  const shouldAutoFit = container.dataset.dagFitKey !== prevSizeKey;
  dagLastCanvasSize = { w: layout.width, h: layout.height };

  // Build SVG edges
  const edgesSvg = edges.map(e => {
    const p1 = layout.pos.get(e.from);
    const p2 = layout.pos.get(e.to);
    if (!p1 || !p2) return '';
    const isInc = selNodeId && (e.from === selNodeId || e.to === selNodeId);
    const col = e.kind === 'produces' ? '#22c55e' : '#38bdf8';
    const sw = isInc ? 2.6 : 1.6;
    const op = selNodeId ? (isInc ? 1 : 0.28) : 0.78;
    const mk = e.kind === 'produces' ? 'url(#dagArrOk)' : 'url(#dagArrDep)';
    let pathD = '';
    if (dagLayoutDir === 'LR') {
      const x1 = p1.x + p1.w, y1 = p1.y + p1.h / 2;
      const x2 = p2.x, y2 = p2.y + p2.h / 2;
      const dx = Math.max(24, Math.abs(x2 - x1) * 0.48);
      pathD = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    } else {
      const x1 = p1.x + p1.w / 2, y1 = p1.y + p1.h;
      const x2 = p2.x + p2.w / 2, y2 = p2.y;
      const dy = Math.max(22, Math.abs(y2 - y1) * 0.48);
      pathD = `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
    }
    return `<path d="${pathD}" fill="none" stroke="${col}" stroke-width="${sw}" opacity="${op}" marker-end="${mk}" />`;
  }).join('');

  // Build SVG nodes
  const nodesSvg = nodes.map(n => {
    const b = layout.pos.get(n.id);
    if (!b) return '';
    const vis = dagNodeVisual(n);
    const isSel = selNodeId === n.id;
    const cls = `dag-node ${n.status === 'working' ? 'working' : ''} ${isSel ? 'selected' : ''}`;
    const line1 = n.label.slice(0, 22);
    const line2 = n.label.length > 22 ? n.label.slice(22, 44) + (n.label.length > 44 ? '…' : '') : '';
    return `<g class="${cls}" transform="translate(${b.x}, ${b.y})" tabindex="0" role="button"
        aria-label="${esc(`${n.id} ${vis.tag}: ${n.label}`)}"
        onclick="selectDagNode('${esc(q.id)}', '${esc(n.id)}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectDagNode('${esc(q.id)}','${esc(n.id)}');}">
      <rect class="node-box" width="${b.w}" height="${b.h}" rx="9" fill="${vis.fill}" stroke="${vis.stroke}" stroke-width="1.6" ${vis.dash ? `stroke-dasharray="${vis.dash}"` : ''} />
      <text x="10" y="18" fill="${vis.hdr}" font-size="10.5" font-weight="700">${esc(n.id)} · ${esc(vis.tag.slice(0, 22))}</text>
      <text x="10" y="39" fill="#e8eefb" font-size="11.5" font-weight="600">${esc(line1)}</text>
      ${line2 ? `<text x="10" y="56" fill="#94a3b8" font-size="10.5">${esc(line2)}</text>` : ''}
    </g>`;
  }).join('');

  // Selected node inspector
  const activeNode = nodes.find(n => n.id === selNodeId) || nodes.find(n => n.status === 'working') || nodes.find(n => n.kind === 'fact') || nodes[0];
  let inspectorHtml = '<div class="muted" style="font-size:12px;">点击图中任意 Fact 或 Intent 节点可展开完整描述与上下游跳转。</div>';
  if (activeNode) {
    const vis = dagNodeVisual(activeNode);
    const upIds = layout.parents.get(activeNode.id) || [];
    const downIds = layout.children.get(activeNode.id) || [];
    const upHtml = upIds.length
      ? upIds.map(id => `<button type="button" class="dag-jump-chip" onclick="selectDagNode('${esc(q.id)}','${esc(id)}')">← ${esc(id)}</button>`).join('')
      : '<span class="muted">无（根节点）</span>';
    const downHtml = downIds.length
      ? downIds.map(id => `<button type="button" class="dag-jump-chip" onclick="selectDagNode('${esc(q.id)}','${esc(id)}')">${esc(id)} →</button>`).join('')
      : '<span class="muted">无（叶节点）</span>';
    const metaParts = [
      `类型: ${vis.tag}`,
      activeNode.worker ? `Worker: ${activeNode.worker}` : null,
      activeNode.created_at ? `创建: ${fmtClockTime(activeNode.created_at)}` : null,
      activeNode.last_heartbeat_at ? `心跳: ${fmtClockTime(activeNode.last_heartbeat_at)}` : null,
      activeNode.concluded_at ? `结束: ${fmtClockTime(activeNode.concluded_at)}` : null,
    ].filter(Boolean).join(' · ');
    inspectorHtml = `
      <div class="dag-inspector">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <div><b style="color:${vis.hdr};">[${esc(activeNode.id)}]</b> <span class="muted" style="font-size:11px;">${esc(metaParts)}</span></div>
          <span class="badge b-muted">观测 ${esc(fmtClockTime(cached.observed_at))}</span>
        </div>
        <div class="dag-jump-row"><span class="muted">上游前置：</span>${upHtml}<span class="muted" style="margin-left:8px;">下游产出：</span>${downHtml}</div>
        <pre class="codebox" style="max-height:160px;">${esc(activeNode.description || '(无描述)')}</pre>
      </div>`;
  }

  const reasonBanner = cached.reason
    ? `<span class="badge b-run">Reason 推理中 · ${esc(cached.reason.worker || 'worker')}</span>`
    : '';
  const bootstrapHint = (stats.facts === 0 && stats.intents === 0)
    ? `<div class="diag-banner info" style="margin-bottom:8px;"><div><b>尚未产生探索分支</b><span>项目目前仅含 Origin / Goal 根节点（可能在 Bootstrap 阶段已直接提交完赛，或尚未进入 Reason/Explore 阶段）。</span></div></div>`
    : '';
  const truncHint = cached.truncated
    ? `<span class="badge b-warn">图谱过大，仅展示最近 160 个节点</span>`
    : '';

  container.innerHTML = `
    <div class="dag-toolbar">
      <div class="dag-tools-group">
        <span class="badge b-ok">Facts: ${stats.facts || 0}</span>
        <span class="badge b-run">Intents: ${stats.intents || 0} (执行中 ${stats.working || 0})</span>
        ${reasonBanner}
        ${truncHint}
        <span class="badge b-muted" title="仅打开本标签且节点数变化时按需查询，不阻塞 Worker">按需拉取·零解题开销</span>
      </div>
      <div class="dag-tools-group">
        <button type="button" class="${dagLayoutDir === 'TB' ? 'btn-primary' : ''}" onclick="setDagLayoutDir('TB')">上→下</button>
        <button type="button" class="${dagLayoutDir === 'LR' ? 'btn-primary' : ''}" onclick="setDagLayoutDir('LR')">左→右</button>
        <button type="button" onclick="adjustDagZoom(-0.15)" aria-label="缩小">−</button>
        <span id="dagZoomLabel" class="muted" style="min-width:38px;text-align:center;font-size:11px;">${Math.round(dagZoom * 100)}%</span>
        <button type="button" onclick="adjustDagZoom(0.15)" aria-label="放大">+</button>
        <button type="button" onclick="fitDagView()">适应画布</button>
        <button id="btnDagExpand" type="button" onclick="toggleDagExpand()">${dagExpanded ? '退出全屏' : '放大展开'}</button>
        <button type="button" onclick="fetchChallengeDag('${esc(q.id)}', '${esc(sig)}', true)">刷新图谱</button>
        ${cached.cairn_ui_url ? `<a href="${esc(cached.cairn_ui_url)}" target="_blank" rel="noopener" style="font-size:11px;margin-left:4px;">原生 Cairn ↗</a>` : ''}
      </div>
    </div>
    ${bootstrapHint}
    <div class="dag-viewport ${dagExpanded ? 'expanded' : ''}" id="dagViewport" aria-label="解题过程 Fact-Intent DAG 交互画布">
      <button id="dagExpandCloseBtn" type="button" class="dag-expand-close" style="display:${dagExpanded ? 'inline-block' : 'none'}" onclick="toggleDagExpand()">退出全屏 (Esc)</button>
      <svg>
        <defs>
          <marker id="dagArrDep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 1 1.5 L 9 5 L 1 8.5 L 2.8 5 z" fill="#38bdf8" />
          </marker>
          <marker id="dagArrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 1 1.5 L 9 5 L 1 8.5 L 2.8 5 z" fill="#22c55e" />
          </marker>
        </defs>
        <g id="dagTransformGroup">
          ${edgesSvg}
          ${nodesSvg}
        </g>
      </svg>
    </div>
    <div class="dag-legend-bar">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <span><span class="dag-dot" style="background:#a78bfa"></span>Origin/Goal</span>
        <span><span class="dag-dot" style="background:#22c55e"></span>已验证 Fact</span>
        <span><span class="dag-dot" style="background:#38bdf8"></span>执行中 Intent</span>
        <span><span class="dag-dot" style="background:#f59e0b"></span>待认领/假设</span>
        <span><span class="dag-dot" style="background:#64748b"></span>已完成 Intent</span>
      </div>
      <span>滚轮缩放 · 拖拽平移 · 点击节点查证据</span>
    </div>
    ${inspectorHtml}
  `;

  bindDagPanZoom();
  if (shouldAutoFit) {
    container.dataset.dagFitKey = prevSizeKey;
    fitDagView();
  } else {
    applyDagTransform();
  }
}

function computeToolsSignature(q) {
  const u = q.llm_usage || {};
  const proxySt = ((latestSnap && latestSnap.connections && latestSnap.connections.proxy) || {}).status || 'unknown';
  const totTools = ((latestSnap && latestSnap.model_telemetry && latestSnap.model_telemetry.total) || {}).tool_calls || 0;
  return `${q.id}|${u.calls || 0}|${u.tool_calls || 0}|${u.tool_errors || 0}|${totTools}|${proxySt}`;
}

async function fetchChallengeTools(qid, sig, force = false) {
  if (toolsInflightQid === qid && !force) return;
  toolsInflightQid = qid;
  try {
    const r = await fetch(`/api/dashboard/tools/${encodeURIComponent(qid)}?force=${force ? 1 : 0}`);
    const data = await r.json();
    toolsCacheByQid[qid] = data;
    toolsSigByQid[qid] = sig;
  } catch (e) {
    toolsCacheByQid[qid] = { available: false, status: 'error', reason: `拉取工具摘要失败：${e.message}`, tools: [] };
  } finally {
    if (toolsInflightQid === qid) toolsInflightQid = null;
    const container = document.getElementById('detailTabContent');
    if (container) delete container.dataset.toolsRenderKey;
    if (activeDetailTab === 'tools' && selectedQid === qid) renderDetail();
  }
}

function setToolsFilter(mode) {
  toolsFilterMode = mode;
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.toolsRenderKey;
  renderDetail();
}

function toggleToolLogExpand(tuid) {
  if (toolsExpandedIds.has(tuid)) toolsExpandedIds.delete(tuid);
  else toolsExpandedIds.add(tuid);
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.toolsRenderKey;
  renderDetail();
}

function toggleAllToolLogs(qid, expandAll) {
  const cached = toolsCacheByQid[qid];
  const list = (cached && cached.tools) || [];
  if (expandAll) list.forEach(t => toolsExpandedIds.add(t.tool_use_id || String(t.seq)));
  else toolsExpandedIds.clear();
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.toolsRenderKey;
  renderDetail();
}

function renderTabTools(q, container) {
  // Preserve typing focus on tool log search box during 2s SSE ticks
  if (document.activeElement && document.activeElement.id === 'toolsSearchInput' && container.dataset.toolsQid === q.id) {
    return;
  }
  const sig = computeToolsSignature(q);
  const cached = toolsCacheByQid[q.id];
  if (!cached || toolsSigByQid[q.id] !== sig) {
    fetchChallengeTools(q.id, sig, false);
  }
  const expKey = Array.from(toolsExpandedIds).sort().join(',');
  const renderKey = `${q.id}|${sig}|${cached ? (cached.observed_at || '') : 'loading'}|${toolsFilterMode}|${toolsSearchTerm}|${expKey}`;
  if (container.dataset.toolsRenderKey === renderKey) return;
  container.dataset.toolsRenderKey = renderKey;
  container.dataset.toolsQid = q.id;

  if (!cached) {
    container.innerHTML = `<div class="kv-card"><div class="k">旁路工具调用日志（零 Worker 侵入）</div><div class="v muted">正在按需从 Token Proxy 环形缓冲读取本题工具调用记录与日志...</div></div>`;
    return;
  }
  if (!cached.available) {
    container.innerHTML = `
      <div class="dag-toolbar">
        <span class="badge b-muted">状态：${esc(cached.status || 'unavailable')}</span>
        <button type="button" onclick="fetchChallengeTools('${esc(q.id)}','${esc(sig)}',true)">重试拉取</button>
      </div>
      <div class="diag-banner ${cached.status === 'disconnected' || cached.status === 'error' ? 'error' : 'info'}">
        <div><b>暂无法获取工具调用日志</b><span>${esc(cached.reason || '未连接模型代理')}${cached.recovery_hint ? `（建议：${esc(cached.recovery_hint)}）` : ''}</span></div>
      </div>`;
    return;
  }

  const u = q.llm_usage || {};
  const stall = q.stall || { level: 'ok', label: '推进正常', reasons: [] };
  const allItems = (cached.tools || []).slice().reverse();
  const term = (toolsSearchTerm || '').trim().toLowerCase();
  const items = allItems.filter(t => {
    if (toolsFilterMode === 'bash' && String(t.tool_name || '').toLowerCase() !== 'bash') return false;
    if (toolsFilterMode === 'error' && !t.is_error) return false;
    if (term) {
      const hay = `${t.tool_name || ''} ${t.summary || ''} ${t.input_detail || ''} ${t.output_detail || ''} ${t.result_preview || ''}`.toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  const fallbackBanner = cached.fallback_untagged
    ? `<div class="diag-banner info" style="margin-bottom:8px;"><div><b>未携带题号归因</b><span>以下展示代理中最近未归因的工具调用（由总控启动的题目会自动按 Origin 识别题号）。</span></div></div>`
    : '';
  const stallBanner = stall.level !== 'ok'
    ? `<div class="diag-banner ${stall.level === 'critical' ? 'error' : 'warn'}" style="margin-bottom:8px;"><div><b>停滞/空转告警：${esc(stall.label)}</b><span>${esc((stall.reasons||[]).join('；'))}</span></div></div>`
    : '';

  const tbl = items.length
    ? `<div class="table-wrap"><table class="tbl"><thead><tr>
        <th>#</th><th>时间</th><th>工具</th><th>调用命令 / 参数摘要（已脱敏）</th><th>状态 / 耗时</th><th>告警</th><th>日志</th>
      </tr></thead><tbody>` +
      items.map(t => {
        const keyId = String(t.tool_use_id || t.seq);
        const isOpen = toolsExpandedIds.has(keyId);
        const stBadge = t.is_error
          ? '<span class="badge b-err">报错</span>'
          : (t.status === 'running' ? '<span class="badge b-run">执行中</span>' : '<span class="badge b-ok">成功</span>');
        const durTxt = isNum(t.duration_sec) ? `${t.duration_sec}s` : '—';
        const repHtml = (t.repeat_streak || 1) >= 3
          ? `<span class="badge b-err">重复×${t.repeat_streak}</span>`
          : ((t.repeat_streak || 1) === 2 ? '<span class="badge b-warn">重复×2</span>' : '<span class="muted">正常</span>');
        const previewHtml = (!isOpen && t.result_preview)
          ? `<div class="muted" style="font-size:11px;margin-top:3px;word-break:break-all;">返回: ${esc(t.result_preview)}</div>`
          : '';
        const detailRow = isOpen
          ? `<tr><td colspan="7" style="background:rgba(9,14,28,0.85);padding:10px 12px;">
              <div style="display:grid;gap:8px;">
                <div>
                  <div class="muted" style="font-size:11px;font-weight:600;">完整调用输入 / 命令（已脱敏，上限 4KB）</div>
                  <pre class="codebox" style="max-height:170px;">${esc(t.input_detail || t.summary || '(空)')}</pre>
                </div>
                <div>
                  <div class="muted" style="font-size:11px;font-weight:600;">完整返回输出 / 报错日志（已脱敏，上限 8KB 保留头尾）</div>
                  <pre class="codebox" style="max-height:240px;">${esc(t.output_detail || t.result_preview || (t.status === 'running' ? '工具仍在执行中，尚未返回结果...' : '(无文本输出)'))}</pre>
                </div>
              </div>
            </td></tr>`
          : '';
        return `<tr>
          <td><code>#${t.seq}</code></td>
          <td>${esc(fmtClockTime(t.ts ? new Date(t.ts * 1000).toISOString() : null))}</td>
          <td><span class="badge b-purple">${esc(t.tool_name)}</span></td>
          <td><code style="word-break:break-all;">${esc(t.summary)}</code>${previewHtml}</td>
          <td>${stBadge} <span class="muted">${durTxt}</span></td>
          <td>${repHtml}</td>
          <td><button type="button" style="padding:2px 7px;font-size:11px;" onclick="toggleToolLogExpand('${esc(keyId)}')">${isOpen ? '收起日志' : '展开日志'}</button></td>
        </tr>${detailRow}`;
      }).join('') + `</tbody></table></div>`
    : `<div class="kv-card"><div class="k">工具调用日志</div><div class="v muted">${allItems.length ? '当前筛选条件下无匹配日志。' : '本题尚无旁路捕获的工具调用（可能尚未发出工具指令，或仅走纯文本推理）。'}</div></div>`;

  container.innerHTML = `
    <div class="dag-toolbar">
      <div class="dag-tools-group">
        <span class="badge b-run">单题调用: ${u.calls || 0} 轮</span>
        <span class="badge b-purple">工具: ${items.length}/${allItems.length} 条</span>
        <span class="badge ${(u.tool_errors||0) ? 'b-err' : 'b-ok'}">报错: ${u.tool_errors || 0}</span>
        <span class="badge b-muted" title="由 token_proxy 旁路内存环缓冲采集（60条/题），按需查询，不增加 Worker 开销">旁路完整日志·零解题开销</span>
      </div>
      <div class="dag-tools-group">
        <button type="button" class="chip ${toolsFilterMode === 'all' ? 'active' : ''}" onclick="setToolsFilter('all')">全部</button>
        <button type="button" class="chip ${toolsFilterMode === 'bash' ? 'active' : ''}" onclick="setToolsFilter('bash')">仅 Bash</button>
        <button type="button" class="chip ${toolsFilterMode === 'error' ? 'active' : ''}" onclick="setToolsFilter('error')">仅报错</button>
        <input id="toolsSearchInput" type="search" placeholder="过滤命令/报错..." value="${esc(toolsSearchTerm)}" style="width:140px;padding:3px 7px;" oninput="toolsSearchTerm=this.value;delete document.getElementById('detailTabContent').dataset.toolsRenderKey;renderDetail();" />
        <button type="button" onclick="toggleAllToolLogs('${esc(q.id)}', true)">全部展开</button>
        <button type="button" onclick="toggleAllToolLogs('${esc(q.id)}', false)">全部收起</button>
        <button type="button" onclick="fetchChallengeTools('${esc(q.id)}','${esc(sig)}',true)">刷新日志</button>
      </div>
    </div>
    ${stallBanner}${fallbackBanner}${tbl}`;
}

function computeLlmSignature(q) {
  const u = q.llm_usage || {};
  const proxySt = ((latestSnap && latestSnap.connections && latestSnap.connections.proxy) || {}).status || 'unknown';
  const totTurns = ((latestSnap && latestSnap.model_telemetry && latestSnap.model_telemetry.total) || {}).llm_turns || 0;
  return `${q.id}|${u.calls || 0}|${totTurns}|${proxySt}`;
}

async function fetchChallengeLlmLogs(qid, sig, force = false) {
  if (llmInflightQid === qid && !force) return;
  llmInflightQid = qid;
  try {
    const r = await fetch(`/api/dashboard/llm-logs/${encodeURIComponent(qid)}?force=${force ? 1 : 0}`);
    const data = await r.json();
    llmCacheByQid[qid] = data;
    llmSigByQid[qid] = sig;
  } catch (e) {
    llmCacheByQid[qid] = { available: false, status: 'error', reason: `拉取模型问答时间线失败：${e.message}`, turns: [] };
  } finally {
    if (llmInflightQid === qid) llmInflightQid = null;
    const container = document.getElementById('detailTabContent');
    if (container) delete container.dataset.llmRenderKey;
    if (activeDetailTab === 'llm' && selectedQid === qid) renderDetail();
  }
}

function setLlmFilter(mode) {
  llmFilterMode = mode;
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.llmRenderKey;
  renderDetail();
}

function toggleLlmOrder() {
  llmOrderAsc = !llmOrderAsc;
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.llmRenderKey;
  renderDetail();
}

function toggleLlmTurnExpand(seq) {
  const k = String(seq);
  if (llmExpandedSeqs.has(k)) llmExpandedSeqs.delete(k);
  else llmExpandedSeqs.add(k);
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.llmRenderKey;
  renderDetail();
}

function toggleAllLlmTurns(qid, expandAll) {
  const cached = llmCacheByQid[qid];
  const list = (cached && cached.turns) || [];
  if (expandAll) list.forEach(t => llmExpandedSeqs.add(String(t.turn_seq)));
  else llmExpandedSeqs.clear();
  const container = document.getElementById('detailTabContent');
  if (container) delete container.dataset.llmRenderKey;
  renderDetail();
}

function jumpToToolLog(toolUseId) {
  if (toolUseId) toolsExpandedIds.add(String(toolUseId));
  setDetailTab('tools');
}

function renderTabLlm(q, container) {
  if (document.activeElement && document.activeElement.id === 'llmSearchInput' && container.dataset.llmQid === q.id) {
    return;
  }
  const sig = computeLlmSignature(q);
  const cached = llmCacheByQid[q.id];
  if (!cached || llmSigByQid[q.id] !== sig) {
    fetchChallengeLlmLogs(q.id, sig, false);
  }
  const expKey = Array.from(llmExpandedSeqs).sort().join(',');
  const renderKey = `${q.id}|${sig}|${cached ? (cached.observed_at || '') : 'loading'}|${llmFilterMode}|${llmSearchTerm}|${llmOrderAsc ? 'asc' : 'desc'}|${expKey}`;
  if (container.dataset.llmRenderKey === renderKey) return;
  container.dataset.llmRenderKey = renderKey;
  container.dataset.llmQid = q.id;

  if (!cached) {
    container.innerHTML = `<div class="kv-card"><div class="k">模型对话时间线（异步旁路采集，零解题阻塞）</div><div class="v muted">正在按需读取本题发给大模型的问题、思考与回答记录...</div></div>`;
    return;
  }
  if (!cached.available) {
    container.innerHTML = `
      <div class="dag-toolbar">
        <span class="badge b-muted">状态：${esc(cached.status || 'unavailable')}</span>
        <button type="button" onclick="fetchChallengeLlmLogs('${esc(q.id)}','${esc(sig)}',true)">重试拉取</button>
      </div>
      <div class="diag-banner ${cached.status === 'disconnected' || cached.status === 'error' ? 'error' : 'info'}">
        <div><b>暂无法获取模型对话时间线</b><span>${esc(cached.reason || '未连接模型代理')}${cached.recovery_hint ? `（建议：${esc(cached.recovery_hint)}）` : ''}</span></div>
      </div>`;
    return;
  }

  const allTurns = (cached.turns || []).slice();
  if (!llmOrderAsc) allTurns.reverse();
  const term = (llmSearchTerm || '').trim().toLowerCase();
  const turns = allTurns.filter(t => {
    if (llmFilterMode === 'answer' && !t.answer_detail) return false;
    if (llmFilterMode === 'thinking' && !t.thinking_detail) return false;
    if (llmFilterMode === 'tools' && !(t.tools_called && t.tools_called.length)) return false;
    if (llmFilterMode === 'error' && t.status < 400 && !t.failover) return false;
    if (term) {
      const hay = `${t.question_detail || ''} ${t.thinking_detail || ''} ${t.answer_detail || ''} ${t.response_model || ''} ${JSON.stringify(t.tools_called || [])}`.toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  const sum = cached.summary || {};
  const fallbackBanner = cached.fallback_untagged

async function fetchHumanReference(qid) {
  const tokEl = document.getElementById('hrefTokInput');
  humanRefToken = (tokEl ? tokEl.value : humanRefToken || '').trim();
  if (!humanRefToken) {
    toast('请输入独立的 HUMAN_REF_TOKEN', 'warn');
    return;
  }
  try {
    const r = await fetch(`/api/human-reference/challenges/${encodeURIComponent(qid)}`, {
      headers: { 'X-Human-Ref-Token': humanRefToken, 'X-Human-Operator': humanOperatorName },
    });
    const data = await r.json();
    if (!r.ok) {
      humanRefCache[qid] = { error: `HTTP ${r.status}: ${data.detail || '拒绝访问'}` };
      toast(`参考服务拒绝访问 (${r.status})`, 'err');
    } else {
      humanRefCache[qid] = data;
      toast(`已加载 ${qid} 人类参考对照（访问已审计）`, 'ok');
    }
  } catch (e) {
    humanRefCache[qid] = { error: String(e) };
  }
  renderDetail();
}

// === Right Column: Connections (Auto-Collapse When All Green), Proxy, Audit & Global Stream ===
function toggleConnPanel() {
  connExpanded = !connExpanded;
  if (latestSnap) renderConnections();
}

function renderConnections() {
  const conns = latestSnap.connections || {};
  document.getElementById('connObsAt').textContent = fmtClockTime(latestSnap.observed_at);
  const names = { platform: '仿真裁判平台', docker: 'Docker 场景运行时', orchestrator: '赛事总控 (Orchestrator)', cairn: 'Cairn 事实图服务', proxy: '模型代理 (Token Proxy)' };
  const stMap = { connected: ['b-ok', '已连接'], degraded: ['b-warn', '降级/过期'], disconnected: ['b-err', '已断开'], unconfigured: ['b-muted', '未配置'] };
  const entries = Object.entries(names);
  const degradedEntries = entries.filter(([k]) => ((conns[k] || {}).status) !== 'connected');
  const allGreen = degradedEntries.length === 0;

  const sumBadge = document.getElementById('connSummaryBadge');
  const toggleBtn = document.getElementById('btnToggleConn');
  if (allGreen) {
    sumBadge.className = 'badge b-ok';
    sumBadge.textContent = '5/5 正常';
    toggleBtn.style.display = 'inline-block';
    toggleBtn.textContent = connExpanded ? '收起' : '展开明细';
  } else {
    sumBadge.className = 'badge b-warn';
    sumBadge.textContent = `${entries.length - degradedEntries.length}/${entries.length} 正常`;
    toggleBtn.style.display = 'inline-block';
    toggleBtn.textContent = connExpanded ? '仅看异常' : '展开全部';
  }

  const cardsEl = document.getElementById('connCards');
  if (allGreen && !connExpanded) {
    cardsEl.innerHTML = `<div class="muted" style="font-size:11px;">平台、Docker、总控、Cairn 与模型代理全部连接正常（自动折叠以节省首屏空间）。</div>`;
    return;
  }

  const toShow = (allGreen || connExpanded) ? entries : degradedEntries;
  cardsEl.innerHTML = toShow.map(([k, title]) => {
    const c = conns[k] || { status: 'unknown' };
    const [cls, txt] = stMap[c.status] || ['b-muted', c.status];
    return `<div class="conn-card">
      <div class="chead"><span>${title}</span><span class="badge ${cls}">${txt}</span></div>
      <div class="cdetail">最后成功：${esc(fmtClockTime(c.last_ok_at))}${isNum(c.age_sec) ? ` (${c.age_sec}s 前)` : ''}</div>
      ${c.error_reason ? `<div class="cdetail err">原因：${esc(c.error_reason)}</div>` : ''}
      ${c.recovery_hint ? `<div class="cdetail">建议：${esc(c.recovery_hint)}</div>` : ''}
    </div>`;
  }).join('');
}

    foHtml,
    `<div class="kv-line"><span>Input / Output Token</span><b>${fmtNum(tot.input)} / ${fmtNum(tot.output)}</b></div>`,
    `<div class="kv-line"><span>Cache Read Token</span><b>${fmtNum(tot.cache_read)}</b></div>`,
  ].filter(Boolean);
  document.getElementById('proxyBox').innerHTML = rows.join('');
}

function renderAudit() {
  const a = latestSnap.audit || {};
  document.getElementById('auditBox').innerHTML = `
    <div class="kv-line"><span>Agent API / MCP 调用（计入限流）</span><b>${fmtNum(a.total_api_calls, '0')} / ${fmtNum(a.total_mcp_calls, '0')}</b></div>
    <div class="kv-line"><span>驾驶舱只读轮询（不计入限流）</span><span class="muted">${fmtNum(a.dashboard_polls, '0')}</span></div>
    <div class="kv-line"><span>限流触发 (AD-002002)</span><b class="${a.rate_limit_hits ? 'err' : 'ok'}">${a.rate_limit_hits || 0}</b></div>
    <div class="kv-line"><span>超槽触发 (AD-162006)</span><b class="${a.scene_limit_hits ? 'err' : 'ok'}">${a.scene_limit_hits || 0}</b></div>
    <div class="kv-line"><span>故障注入 / 已自愈</span><b>${a.scene_faults_injected || 0} / ${a.scene_faults_recovered || 0}</b></div>
    <div class="kv-line"><span>凭据/密钥泄露检出</span><b class="${(a.credential_leaks||[]).length ? 'err' : 'ok'}">${(a.credential_leaks||[]).length}</b></div>
    <div class="kv-line"><span>已解未释放场景</span><b class="${(a.unstopped_solved_scenes||[]).length ? 'warn' : 'ok'}">${(a.unstopped_solved_scenes||[]).length}</b></div>
    <div class="kv-line"><span>人工干预审计记录</span><b>${(a.human_interventions||[]).length}</b></div>
  `;
}

function renderGlobalFeed() {
  const sev = document.getElementById('feedSevFilter').value;
  const qf = document.getElementById('feedQFilter').value;
  document.getElementById('seqBadge').textContent = `seq #${maxSeenSeq} · 共 ${orderedEvents.length} 条`;

  const filtered = orderedEvents.filter(ev => {
    if (sev !== 'all' && ev.severity !== sev) return false;
    if (qf !== 'all' && ev.challenge_id !== qf) return false;
    return true;
  }).slice().reverse().slice(0, 80);

  const box = document.getElementById('feedBox');
  const prevTop = box.scrollTop;
  box.innerHTML = filtered.map(ev => `<div class="feed-item ${esc(ev.severity)} ${highlightedEventId === ev.event_id ? 'highlight' : ''}" id="gev-${esc(ev.event_id)}">
    <div class="feed-meta"><span>#${ev.seq} · ${esc(ev.source)} · ${esc(ev.challenge_id || '全局')}</span><span>${esc(fmtClockTime(ev.observed_at))}</span></div>
    <div>${esc(ev.message)}</div>
  </div>`).join('') || '<div class="muted" style="padding:8px;">暂无匹配事件</div>';

  if (pauseGlobalScroll) box.scrollTop = prevTop;
}

function jumpToEvent(eventId) {
  highlightedEventId = eventId;
  setDetailTab('exec');
  renderGlobalFeed();
  const el = document.getElementById(`qev-${eventId}`) || document.getElementById(`gev-${eventId}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function toggleTaxonomyMode() {
  showAllCanonical8 = !showAllCanonical8;
  if (latestSnap) render(latestSnap);
}
function togglePauseScroll() {
  pauseGlobalScroll = !pauseGlobalScroll;
  const btn = document.getElementById('btnPauseScroll');
  btn.textContent = pauseGlobalScroll ? '已暂停滚动（点击恢复）' : '暂停滚动';
  btn.classList.toggle('btn-warn', pauseGlobalScroll);
}

// === Action Handlers with <300ms Local Feedback & Accessible Modals (D09) ===
async function handleManualRefresh() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = '刷新中...';
  try {
    const r = await fetch('/api/dashboard/snapshot');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const snap = await r.json();
    await render(snap);
    toast(`已同步最新状态（观测时刻 ${fmtClockTime(snap.observed_at)}）`, 'ok');
  } catch (e) {
    toast(`刷新失败：${e.message}`, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '立即刷新';
  }
}

async function handleReleaseNextWave() {
  const btn = document.getElementById('btnRelease');
  btn.disabled = true;
  btn.dataset.loading = '1';
  btn.textContent = '释放中...';
  try {
    const r = await fetch('/api/admin/release-next', { method: 'POST' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    toast(data.message || '操作已完成', (data.unlocked || []).length ? 'ok' : 'info');
    await handleManualRefresh();
  } catch (e) {
    toast(`释放失败：${e.message}`, 'err');
  } finally {
    delete btn.dataset.loading;
    if (latestSnap) render(latestSnap);
  }
}

let modalActionFn = null;
function openModal(title, bodyHtml, confirmLabel, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const cbtn = document.getElementById('modalConfirmBtn');
  cbtn.textContent = confirmLabel;
  modalActionFn = onConfirm;
  document.getElementById('modalBackdrop').classList.add('open');
  cbtn.focus();
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  modalActionFn = null;
}
document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
  if (!modalActionFn) return;
  const fn = modalActionFn;
  closeModal();
  await fn();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    closeModal();
    if (dagExpanded) toggleDagExpand();
  }
});

function handleExportReport() {
  const a = document.createElement('a');
  a.href = '/api/dashboard/export-report?format=md';
  a.download = `cockpit-report-${currentRunId || 'live'}.md`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('已开始导出本轮评估快照报告（Markdown）', 'ok');
}

function openSkipModal(qid) {
  openModal(
    `跳过 / 止损本题：${qid}`,
    `<div><b>作用对象：</b>题目 <code>${esc(qid)}</code></div>
     <div><b>具体影响：</b>若该题有运行中的 Docker 靶机，将立即停止释放槽位，标记为「已人工跳过」并记入人工干预审计日志（仅限本地评估止损使用）。</div>`,
    '确认跳过本题',
    async () => {
      try {
        const r = await fetch(`/api/admin/skip-question/${encodeURIComponent(qid)}`, { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        toast(d.message || `已跳过 ${qid}`, 'warn');
        await handleManualRefresh();
      } catch (e) {
        toast(`跳过失败：${e.message}`, 'err');
      }
    }
  );
}

function openResetQModal(qid) {
  openModal(
    `重置单题准备重跑：${qid}`,
    `<div><b>作用对象：</b>仅重置题目 <code>${esc(qid)}</code>（不影响其他题目得分与状态）</div>
     <div><b>具体影响：</b>停止本题运行中靶机，清空本题已得 Flag、Attempt 历史与 DAG/工具缓存，便于定向复测。</div>`,
    '确认重置单题',
    async () => {
      try {
        const r = await fetch(`/api/admin/reset-question/${encodeURIComponent(qid)}`, { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        delete dagCacheByQid[qid];
        delete toolsCacheByQid[qid];
        delete llmCacheByQid[qid];
        delete llmSigByQid[qid];
        toast(d.message || `已重置 ${qid}`, 'warn');
        await handleManualRefresh();
      } catch (e) {
        toast(`重置单题失败：${e.message}`, 'err');
      }
    }
  );
}

function openFaultModal(qid) {
  openModal(
    `预设场景启动故障：${qid}`,
    `<div><b>作用对象：</b>题目 <code>${esc(qid)}</code> 的靶机场景</div>
     <div><b>生效时机：</b>下一次调用启动场景（<code>question_start</code>）时触发，<b>不会中断</b>当前已在运行的实例。</div>
     <div><b>影响说明：</b>平台将模拟一次环境启动失败（返回内部场景状态 20），用于测试总控是否能自动执行「停止 → 等待确认已停止 → 重新启动」的自愈流程。</div>`,
    '确认预设故障',
    async () => {
      try {
        const r = await fetch(`/api/admin/inject-fault/${encodeURIComponent(qid)}`, { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        toast(d.message || '已预设启动故障', 'warn');
        await handleManualRefresh();
      } catch (e) {
        toast(`预设故障失败：${e.message}`, 'err');
      }
    }
  );
}

function openResetModal() {
  openModal(
    '确认重置整场仿真赛？',
    `<div><b>作用对象：</b>当前本地仿真平台全部赛题与评分状态</div>
     <div><b>具体影响：</b>清空所有已得分数、Flag 提交记录、Attempt 历史与事件流；停止所有运行中 Docker 靶机容器，并恢复原始分阶段放题计时。</div>
     <div><b>生效时机：</b>确认后立即生效。</div>`,
    '确认重置',
    async () => {
      try {
        const r = await fetch('/api/admin/reset', { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        toast(d.message || '仿真赛已重置', 'warn');
        await handleManualRefresh();
      } catch (e) {
        toast(`重置失败：${e.message}`, 'err');
      }
    }
  );
}

function openNoteModal(qid) {
  openModal(
    `记录人工干预/审计备注：${qid}`,
    `<div>请填写本次人工观察或干预说明（仅记入驾驶舱审计日志，不向 Worker 泄露参考答案）：</div>
     <input id="opNoteInput" type="text" placeholder="例如：发现工具超时，建议下轮观察是否换路" style="width:100%;" />
     <label style="display:flex;gap:6px;align-items:center;"><input id="opAutonomyChk" type="checkbox" /> <span>标记为「影响自主评测」（如人工发送过具体解题提示）</span></label>`,
    '保存审计记录',
    async () => {
      const summary = (document.getElementById('opNoteInput').value || '').trim();
      const affects = Boolean(document.getElementById('opAutonomyChk').checked);
      if (!summary) { toast('备注不能为空', 'warn'); return; }
      const r = await fetch(`/api/admin/operator-action/${encodeURIComponent(qid)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: affects ? 'hint' : 'note', operator: humanOperatorName, summary, affects_autonomy: affects }),
      });
      if (r.ok) {
        toast(`已写入 ${qid} 人工审计记录`, 'ok');
        await handleManualRefresh();
      } else {
        toast('写入审计记录失败', 'err');
      }
    }
  );
}

// === SSE Live Stream with Reconnect Indicator ===
function connectSSE() {
  const dot = document.getElementById('connDot');
  const es = new EventSource('/api/dashboard/stream');
  es.onopen = () => { dot.className = 'live-dot'; };
  es.onmessage = ev => {
    dot.className = 'live-dot';
    try { render(JSON.parse(ev.data)); } catch (_) {}
  };
  es.onerror = () => { dot.className = 'live-dot warn'; };
}

handleManualRefresh();
connectSSE();
</script>
